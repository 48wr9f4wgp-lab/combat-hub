name: Inspect Ring Events
on:
  push:
    branches: [chatgpt/boxing-ring-parser-inspect3]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect Ring event detail
        shell: bash
        run: |
          node <<'NODE'
          const url='https://www.ringmagazine.com/events/garcia-vs-benn-7lwM37BFvTG9clZQi9f23U';
          const res=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'text/html'}});
          const html=await res.text();
          console.log('status',res.status,'bytes',html.length);
          console.log('title', (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]);
          const heads=[...html.matchAll(/<h[1-4][^>]*>([\s\S]*?)<\/h[1-4]>/gi)].map(m=>m[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
          console.log('heads',JSON.stringify(heads.slice(0,30)));
          const flight=html.replace(/\\"/g,'"').replace(/\\u0026/g,'&');
          for(const needle of ['"mainFight"','"fighterA"','"fighterB"','Ryan Garcia','Conor Benn','"fights"']){
            const i=flight.indexOf(needle);
            console.log('\nNEEDLE',needle,'INDEX',i);
            if(i>=0) console.log(flight.slice(Math.max(0,i-400),i+2400).replace(/\s+/g,' '));
          }
          const pair=flight.match(/"mainFight":\{[\s\S]{0,20000}?"fighterA":\{[\s\S]{0,5000}?"name":"([^"]+)"[\s\S]{0,20000}?"fighterB":\{[\s\S]{0,5000}?"name":"([^"]+)"/);
          console.log('mainPair',pair&&pair.slice(1));
          NODE
