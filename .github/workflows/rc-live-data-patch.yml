name: RC Live Data Patch

on:
  push:
    branches:
      - chatgpt/rc-live-data-hardening-v7.12.0
    paths:
      - .github/workflows/rc-live-data-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/rc-live-data-hardening-v7.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply RC live-data patch
        run: python3 tools/rc_live_data_patch.py
      - name: Focused verification
        run: |
          node --check combat-hub.js
          node --check tests/combat-hub-event-transition-regression.mjs
          node tests/combat-hub-event-transition-regression.mjs
      - name: Commit patched runtime
        run: |
          git config user.name "chatgpt-combat-hub"
          git config user.email "actions@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-event-transition-regression.mjs .github/workflows/combat-hub-regression.yml
          git commit -m "fix: harden RC live event transitions"
          git push origin HEAD:chatgpt/rc-live-data-hardening-v7.12.0
