name: TEMP ONE 169 markup probe

on:
  push:
    branches:
      - audit/live-data-v7.8.0

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official ONE event markup near fighter rows
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.onefc.com/events/one-friday-fights-169/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 COMBAT-HUB-AUDIT'})
          html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
          print('LEN',len(html))
          for needle in ['Petmuangsri Torfunfarm','Khunponnoi Sor Sommai','Gregor Thom','Sunvo Torfunfarm']:
              i=html.find(needle)
              print('\n===',needle,'INDEX',i,'===')
              if i>=0:
                  print(html[max(0,i-900):i+1400].replace('\n',' '))
          PY
