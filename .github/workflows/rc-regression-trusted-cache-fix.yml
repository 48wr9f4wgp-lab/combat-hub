name: RC Regression Trusted Cache Fix

on:
  push:
    branches:
      - chatgpt/rc-live-data-hardening-v7.12.0-clean
    paths:
      - .github/workflows/rc-regression-trusted-cache-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/rc-live-data-hardening-v7.12.0-clean
      - name: Update stale-cache priority regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/combat-hub-regression.mjs')
          s=p.read_text()
          old="""// Stale event cache remains a recovery path when live discovery fails.
{
  const now = Date.parse('2026-09-20T00:00:00+09:00');
  const { api, fm } = await boot('UFC', { now });
  const path = fm.api.joinPath('/docs', 'combat-hub-next-ufc.json');
  fm.api.writeString(path, JSON.stringify({
    savedAt: now - 5 * 3600_000,
    data: {
      startAt: '2026-10-01T19:00:00+09:00',
      location: 'Test',
      name: 'UFC Stale Event',
      main: { a: 'A', b: 'B', context: '' },
      support: [],
    },
  }));
  const data = await api.loadData();
  assert.equal(data.name, 'UFC Stale Event');
  assert.equal(data.stale, true, 'Stale cache fallback flag missing');
}
"""
          new="""// Trusted official next snapshot must outrank stale cache when live discovery fails.
{
  const now = Date.parse('2026-09-20T00:00:00+09:00');
  const { api, fm } = await boot('UFC', { now });
  const path = fm.api.joinPath('/docs', 'combat-hub-next-ufc.json');
  fm.api.writeString(path, JSON.stringify({
    savedAt: now - 5 * 3600_000,
    data: {
      startAt: '2026-10-01T19:00:00+09:00',
      location: 'Test',
      name: 'UFC Stale Event',
      main: { a: 'A', b: 'B', context: '' },
      support: [],
    },
  }));
  const data = await api.loadData();
  assert.equal(data.name, 'Crypto.com UFC 331: Van vs Pantoja 2');
  assert.equal(data.trustedNext, true, 'Trusted next snapshot should outrank stale cache');
}
"""
          assert old in s, 'stale-cache regression block not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify regression syntax
        run: node --check tests/combat-hub-regression.mjs
      - name: Commit test update
        run: |
          git config user.name "chatgpt-combat-hub"
          git config user.email "actions@users.noreply.github.com"
          git add tests/combat-hub-regression.mjs
          git commit -m "test: prefer trusted next snapshot over stale cache"
          git push origin HEAD:chatgpt/rc-live-data-hardening-v7.12.0-clean
