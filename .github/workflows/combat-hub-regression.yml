name: COMBAT HUB Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combat-hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply full Japanese display layer
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794' && !contains(github.event.head_commit.message, 'feat: localize event and fighter display names to Japanese')
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()
          s=s.replace("// v7.9.3-github — Large V3.2 visual polish", "// v7.9.4-github — full Japanese display", 1)
          s=s.replace("const VERSION='7.9.3-github';", "const VERSION='7.9.4-github';", 1)
          anchor="function jpCardLabel(label){const v=String(label||'').trim().toUpperCase();if(v==='CO-MAIN')return'セミ';if(v==='MAIN CARD')return'本戦';if(v==='FEATURED')return'注目';if(v==='TITLE FIGHT')return'タイトル戦';if(v==='UNDERCARD')return'前座';return String(label||'');}"
          display="""const JP_DISPLAY={
'Noche UFC':'ノーチェUFC',
'Crypto.com UFC 331: Van vs Pantoja 2':'Crypto.com UFC 331：ヴァン vs パントージャ2',
'RIZIN LANDMARK 16 in NAGASAKI':'RIZIN LANDMARK 16 in 長崎',
'ONE Friday Fights 170':'ONE フライデーファイツ 170',
'ONE Friday Fights 170 & The Inner Circle 30':'ONE フライデーファイツ 170',
'ONE Friday Fights 170 & The Inner Circle':'ONE フライデーファイツ 170',
'Garcia vs Benn':'ガルシア vs ベン',
'Jean Silva':'ジェアン・シウヴァ','Jose Miguel Delgado':'ホセ・ミゲル・デルガド',
'Brandon Moreno':'ブランドン・モレノ','Joseph Morales':'ジョセフ・モラレス',
'Tommy McMillen':'トミー・マクミレン','Marwan Rahiki':'マルワン・ラヒキ',
'Manon Fiorot':'マノン・フィオロ','Alexa Grasso':'アレクサ・グラッソ',
'Waldo Cortes Acosta':'ワルド・コルテス・アコスタ','Curtis Blaydes':'カーティス・ブレイズ',
'David Martinez':'ダヴィッド・マルティネス','Dan Ige':'ダン・イゲ',
'Joshua Van':'ジョシュア・ヴァン','Alexandre Pantoja':'アレシャンドレ・パントージャ',
'Yodlekpet Or Atchariya':'ヨードレックペット','Yodlekpet':'ヨードレックペット',
'Pompet Pongsuphan PK':'ポンペット','Pompet':'ポンペット',
'Ayad Albadr':'アヤド・アルバドル','Kongchai Chanaidonmueang':'ゴンチャイ・チャナイドンムラン',
'Yodthewin Mor Rajabhatmubanchombueng':'ヨッドテーウィン','Otis Waghorn':'オーティス・ワグホーン',
'Xavier Gonzalez':'チャビエル・ゴンザレス','Thway Lin Htet':'スイ・リン・テート',
'Dabdam Por Tor Tor Thongtawee':'ダブダム','Petsangwan Sor Samarngarment':'ペットサンワン',
'Ryan Garcia':'ライアン・ガルシア','Conor Benn':'コナー・ベン',
'Jai Opetaia':'ジェイ・オペタイア','Noel Mikaelian':'ノエル・ミカエリアン'
};
function jpDisplay(v){const raw=stripHTML(v);return JP_DISPLAY[raw]||raw;}"""
          if 'const JP_DISPLAY={' not in s:
            if anchor not in s: raise SystemExit('jpCardLabel anchor missing')
            s=s.replace(anchor,anchor+'\n'+display,1)
          s=s.replace("function renderMainName(box,name){const parts=mainNameParts(name);", "function renderMainName(box,name){const parts=mainNameParts(jpDisplay(name));", 1)
          s=s.replace("function renderLargeMainName(box,name){const parts=mainNameParts(name);", "function renderLargeMainName(box,name){const parts=mainNameParts(jpDisplay(name));", 1)
          s=s.replace("tx(a,row.a,supportFont(row.a),new Color(C.text),'semibold')", "tx(a,jpDisplay(row.a),supportFont(jpDisplay(row.a)),new Color(C.text),'semibold')")
          s=s.replace("tx(b,row.b,supportFont(row.b),new Color(C.text),'semibold')", "tx(b,jpDisplay(row.b),supportFont(jpDisplay(row.b)),new Color(C.text),'semibold')")
          s=s.replace("tx(a,row.a,9.4,new Color(C.text),'semibold')", "tx(a,jpDisplay(row.a),9.4,new Color(C.text),'semibold')")
          s=s.replace("tx(b,row.b,9.4,new Color(C.text),'semibold')", "tx(b,jpDisplay(row.b),9.4,new Color(C.text),'semibold')")
          s=s.replace("tx(aa,row.a,7.2,new Color(C.text),'semibold')", "tx(aa,jpDisplay(row.a),7.2,new Color(C.text),'semibold')")
          s=s.replace("tx(bb,row.b,7.2,new Color(C.text),'semibold')", "tx(bb,jpDisplay(row.b),7.2,new Color(C.text),'semibold')")
          s=s.replace("const en=tx(hl,stripHTML(D.name||''),7.3", "const en=tx(hl,jpDisplay(D.name||''),7.3")
          s=s.replace("stripHTML(next.name||'次大会')", "jpDisplay(next.name||'次大会')")
          s=s.replace("stripHTML(D.name||D.main.context)", "jpDisplay(D.name||D.main.context)")
          p.write_text(s)
          for fp in ['tests/combat-hub-current-data-audit.mjs','tests/combat-hub-large-regression.mjs']:
            t=Path(fp); q=t.read_text(); q=q.replace("7\\.9\\.3-github", "7\\.9\\.4-github"); t.write_text(q)
          Path('tests/combat-hub-japanese-display.mjs').write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst src=fs.readFileSync(new URL('../combat-hub.js', import.meta.url),'utf8');\nassert.match(src,/const VERSION='7\\.9\\.4-github'/);\nassert.match(src,/const JP_DISPLAY=\\{/);\nfor(const s of ['ノーチェUFC','ジェアン・シウヴァ','ホセ・ミゲル・デルガド','ブランドン・モレノ','マノン・フィオロ','アレクサ・グラッソ','ONE フライデーファイツ 170','ヨードレックペット','ポンペット','ライアン・ガルシア','コナー・ベン','Crypto.com UFC 331：ヴァン vs パントージャ2']) assert.ok(src.includes(s),`missing Japanese alias: ${s}`);\nassert.match(src,/mainNameParts\\(jpDisplay\\(name\\)\\)/);\nassert.match(src,/jpDisplay\\(row\\.a\\)/);\nassert.match(src,/jpDisplay\\(row\\.b\\)/);\nassert.match(src,/jpDisplay\\(D\\.name\\|\\|''\\)/);\nassert.match(src,/jpDisplay\\(next\\.name\\|\\|'次大会'\\)/);\nconsole.log('Japanese display regression OK');\n""")
          PY
      - name: Runtime syntax check
        run: node --check combat-hub.js
      - name: Production Loader syntax check
        run: node --check combat-hub-loader.js
      - name: Preview Loader syntax check
        run: node --check combat-hub-preview-loader.js
      - name: Large Preview Loader syntax check
        run: node --check combat-hub-large-preview-loader.js
      - name: Regression-suite syntax check
        run: node --check tests/combat-hub-regression.mjs
      - name: Cache regression syntax check
        run: node --check tests/combat-hub-cache-regression.mjs
      - name: ONE composite-time regression syntax check
        run: node --check tests/combat-hub-one-composite-regression.mjs
      - name: UFC roll-forward regression syntax check
        run: node --check tests/combat-hub-ufc-rollforward-regression.mjs
      - name: K-1 layout regression syntax check
        run: node --check tests/combat-hub-k1-layout-regression.mjs
      - name: Typography regression syntax check
        run: node --check tests/combat-hub-typography-regression.mjs
      - name: Current-data audit regression syntax check
        run: node --check tests/combat-hub-current-data-audit.mjs
      - name: Large widget regression syntax check
        run: node --check tests/combat-hub-large-regression.mjs
      - name: Japanese display regression syntax check
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794'
        run: node --check tests/combat-hub-japanese-display.mjs
      - name: COMBAT HUB regression suite
        run: node tests/combat-hub-regression.mjs
      - name: COMBAT HUB cache performance suite
        run: node tests/combat-hub-cache-regression.mjs
      - name: COMBAT HUB ONE composite-time suite
        run: node tests/combat-hub-one-composite-regression.mjs
      - name: COMBAT HUB UFC roll-forward suite
        run: node tests/combat-hub-ufc-rollforward-regression.mjs
      - name: COMBAT HUB K-1 layout suite
        run: node tests/combat-hub-k1-layout-regression.mjs
      - name: COMBAT HUB typography suite
        run: node tests/combat-hub-typography-regression.mjs
      - name: COMBAT HUB current-data audit suite
        run: node tests/combat-hub-current-data-audit.mjs
      - name: COMBAT HUB Large widget suite
        run: node tests/combat-hub-large-regression.mjs
      - name: COMBAT HUB Japanese display suite
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794'
        run: node tests/combat-hub-japanese-display.mjs
      - name: Commit full Japanese display
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794' && !contains(github.event.head_commit.message, 'feat: localize event and fighter display names to Japanese')
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/
          git commit -m 'feat: localize event and fighter display names to Japanese'
          git push origin HEAD:chatgpt/full-ja-v794
