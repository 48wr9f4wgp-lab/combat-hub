name: One-shot BOXING pending poster suppression

on:
  push:
    branches:
      - chatgpt/boxing-pending-poster-suppress-v7.12.5

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: suppress stale BOXING poster while next event is pending'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('combat-hub.js')
          s = p.read_text()
          old = "if(KEY==='boxing'&&config.widgetFamily==='large'){const safePoster=!!D.lockedCurrent||sameEventIdentity(D,SNAPSHOT.boxing);return{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:safePoster?await eventPoster(D):null,lightweight:true};}"
          new = "if(KEY==='boxing'&&config.widgetFamily==='large'){const safePoster=!D.nextPending&&!D.lightweightPending&&(!!D.lockedCurrent||sameEventIdentity(D,SNAPSHOT.boxing));return{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:safePoster?await eventPoster(D):null,lightweight:true};}"
          if old not in s:
              raise SystemExit('BOXING safePoster source marker not found')
          s = s.replace('// v7.12.4-github — BOXING Large normal runtime restore', '// v7.12.5-github — suppress stale BOXING poster during pending state')
          s = s.replace("const VERSION='7.12.4-github';", "const VERSION='7.12.5-github';")
          s = s.replace(old, new)
          p.write_text(s)

          t = Path('tests/combat-hub-large-regression.mjs')
          ts = t.read_text()
          old_test = r"assert.match(src, /if\\(KEY==='boxing'&&config\\.widgetFamily==='large'\\)\\{const safePoster=!!D\\.lockedCurrent\\|\\|sameEventIdentity\\(D,SNAPSHOT\\.boxing\\);return\\{a:\\{name:D\\.main\\.a,image:null\\},b:\\{name:D\\.main\\.b,image:null\\},poster:safePoster\\?await eventPoster\\(D\\):null,lightweight:true\\};\\}/, 'BOXING Large must only load a known-safe rollover poster');"
          new_test = r"assert.match(src, /if\\(KEY==='boxing'&&config\\.widgetFamily==='large'\\)\\{const safePoster=!D\\.nextPending&&!D\\.lightweightPending&&\\(!!D\\.lockedCurrent\\|\\|sameEventIdentity\\(D,SNAPSHOT\\.boxing\\)\\);return\\{a:\\{name:D\\.main\\.a,image:null\\},b:\\{name:D\\.main\\.b,image:null\\},poster:safePoster\\?await eventPoster\\(D\\):null,lightweight:true\\};\\}/, 'BOXING Large pending state must suppress stale rollover posters');"
          if old_test not in ts:
              raise SystemExit('BOXING Large regression marker not found')
          ts = ts.replace(old_test, new_test)
          t.write_text(ts)
          PY
      - name: Verify patch
        shell: bash
        run: |
          node --check combat-hub.js
          node tests/combat-hub-large-regression.mjs
          grep -q "const VERSION='7.12.5-github';" combat-hub.js
          grep -q "safePoster=!D.nextPending&&!D.lightweightPending" combat-hub.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "48wr9f4wgp-lab"
          git config user.email "48wr9f4wgp@privaterelay.appleid.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git diff --cached --quiet && exit 1
          git commit -m "fix: suppress stale BOXING poster while next event is pending"
          git push origin HEAD:chatgpt/boxing-pending-poster-suppress-v7.12.5
