name: Japanese v7.11.3 Patch

on:
  push:
    branches:
      - chatgpt/japanese-v7-11-3

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Japanese display completion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              s=s.replace(old,new,1)

          rep('// v7.11.2-github — Large V5.2 readability pass','// v7.11.3-github — Japanese display completion','version comment')
          rep("const VERSION='7.11.2-github';","const VERSION='7.11.3-github';",'version')
          rep("boxing:{label:'BOXING',accent:'#4BA3FF'","boxing:{label:'ボクシング',accent:'#4BA3FF'",'boxing label')
          rep("'Jai Opetaia':'ジェイ・オペタイア','Noel Mikaelian':'ノエル・ミカエリアン'\n};", "'Jai Opetaia':'ジェイ・オペタイア','Noel Mikaelian':'ノエル・ミカエリアン',\n'Nadaka':'吉成名高','Nadaka Yoshinari':'吉成名高',\n'Har Ling Om':'ハー・リン・オム','Ling Om':'ハー・リン・オム',\n'Yuya Wakamatsu':'若松佑弥','Willie van Rooyen':'ウィリー・ファン・ローエン',\n'Shimon Yoshinari':'士門','Suablack Tor Pran49':'スーブラック','Suablack':'スーブラック',\n'Hyu':'陽勇','Hyuma Hitachi':'常陸飛雄馬'\n};", 'ONE SAMURAI 3 aliases')
          rep("if(/Las Vegas|ラスベガス/i.test(v))return'ラスベガス';if(/代々木|Yoyogi/i.test(v))return'東京・代々木第二';", "if(/Las Vegas|ラスベガス/i.test(v))return'ラスベガス';if(/Yokohama Buntai|Yokohama BUNTAI|横浜BUNTAI|Yokohama|横浜/i.test(v))return'横浜BUNTAI';if(/代々木|Yoyogi/i.test(v))return'東京・代々木第二';", 'Yokohama location')
          p.write_text(s)

          t=Path('tests/combat-hub-japanese-display.mjs')
          q=t.read_text()
          old="for(const s of ['ノーチェUFC','ジェアン・シウヴァ','ホセ・ミゲル・デルガド','ブランドン・モレノ','マノン・フィオロ','アレクサ・グラッソ','ONE フライデーファイツ 170','ヨードレックペット','ポンペット','ライアン・ガルシア','コナー・ベン','Crypto.com UFC 331：ヴァン vs パントージャ2'])"
          new="for(const s of ['ノーチェUFC','ジェアン・シウヴァ','ホセ・ミゲル・デルガド','ブランドン・モレノ','マノン・フィオロ','アレクサ・グラッソ','ONE フライデーファイツ 170','ヨードレックペット','ポンペット','吉成名高','ハー・リン・オム','若松佑弥','ウィリー・ファン・ローエン','士門','スーブラック','陽勇','常陸飛雄馬','ライアン・ガルシア','コナー・ベン','ジェイ・オペタイア','ノエル・ミカエリアン','Crypto.com UFC 331：ヴァン vs パントージャ2'])"
          if old not in q:
              raise SystemExit('missing japanese alias test target')
          q=q.replace(old,new,1)
          q=q.replace("assert.match(src,/function largeNextTitle\\(next\\)/);", "assert.match(src,/function largeNextTitle\\(next\\)/);\nassert.match(src,/boxing:\\{label:'ボクシング'/);\nassert.ok(src.includes(\"return'横浜BUNTAI'\"),'Yokohama venue must be localized');",1)
          t.write_text(q)
          PY
      - name: Runtime syntax check
        run: node --check combat-hub.js
      - name: Full regression suite
        run: |
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit Japanese display completion
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add combat-hub.js tests/combat-hub-japanese-display.mjs
            git commit -m 'fix: complete Japanese display for ONE and boxing'
            git push
          fi
