name: Apply BOXING Ring parser
on:
  push:
    branches: [chatgpt/boxing-ring-parser]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-ring-parser
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Ring-specific parser
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          rm -f .github/workflows/apply-boxing-ring-parser.yml
      - name: Syntax and regression
        run: |
          node --check combat-hub.js
          node --check tests/combat-hub-large-regression.mjs
          node --check tests/combat-hub-event-transition-regression.mjs
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-event-transition-regression.mjs
          node tests/combat-hub-regression.mjs
          node tests/combat-hub-cache-regression.mjs
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "48wr9f4wgp-lab"
          git config user.email "48wr9f4wgp@privaterelay.appleid.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs tests/combat-hub-event-transition-regression.mjs .github/workflows/apply-boxing-ring-parser.yml
          git commit -m "feat: parse official Ring boxing events"
          git push origin HEAD:chatgpt/boxing-ring-parser
