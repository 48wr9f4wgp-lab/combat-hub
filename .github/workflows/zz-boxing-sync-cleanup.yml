name: Temporary BOXING sync cleanup

on:
  push:
    branches:
      - chatgpt/boxing-sync-cleanup
    paths:
      - .github/workflows/zz-boxing-sync-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-sync-cleanup
      - name: Apply cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('combat-hub.js')
          src = runtime.read_text()
          replacements = {
              "// v7.12.6-github — BOXING widget sync audit + Medium memory guard": "// v7.12.7-github — remove temporary sync UI; retain BOXING runtime audit + memory guard",
              "const VERSION='7.12.6-github';": "const VERSION='7.12.7-github';",
              "tx(nline,VERSION.replace('-github',''),5.8,new Color('#6F7782'),'semibold');": "",
              "tx(foot,KEY==='boxing'&&D.nextPending?`同期 ${VERSION.replace('-github','')}`:'公式更新を自動反映',6.8,footColor,'semibold');": "tx(foot,'公式更新を自動反映',6.8,footColor,'semibold');",
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'missing runtime target: {old}')
              src = src.replace(old, new, 1)
          runtime.write_text(src)

          test = Path('tests/combat-hub-large-regression.mjs')
          t = test.read_text()
          old_assert = "assert.match(src, /KEY==='boxing'&&D\\.nextPending\\?`同期 \\${VERSION\\.replace\\('-github',''\\)}`/, 'BOXING Medium temporary sync marker missing');"
          new_assert = "assert.doesNotMatch(src, /VERSION\\.replace\\('-github',''\\)/, 'temporary visible runtime version markers should be removed');"
          if old_assert not in t:
              raise SystemExit('missing temporary sync-marker assertion')
          t = t.replace(old_assert, new_assert, 1)
          t = t.replace("console.log('COMBAT HUB Large V5.2 + BOXING Medium/Large memory+sync regression: OK');", "console.log('COMBAT HUB Large V5.2 + BOXING Medium/Large memory+audit regression: OK');", 1)
          test.write_text(t)
          PY

          node --check combat-hub.js
          node --check tests/combat-hub-large-regression.mjs
          rm .github/workflows/zz-boxing-sync-cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs .github/workflows/zz-boxing-sync-cleanup.yml
          git commit -m "chore: remove temporary BOXING sync markers"
          git push origin HEAD:chatgpt/boxing-sync-cleanup
