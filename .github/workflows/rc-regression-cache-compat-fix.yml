name: RC Regression Cache Compat Fix

on:
  push:
    branches:
      - chatgpt/rc-live-data-hardening-v7.12.0-clean
    paths:
      - .github/workflows/rc-regression-cache-compat-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/rc-live-data-hardening-v7.12.0-clean
      - name: Update legacy cache assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/combat-hub-regression.mjs')
          s=p.read_text()
          pairs=[
            ("has(/now-cached\\.savedAt<4\\*3600000/, 'next-event cache TTL changed unexpectedly');","has(/now-Number\\(cached\\.savedAt\\)<4\\*3600000/, 'next-event cache TTL changed unexpectedly');"),
            ("has(/if\\(cached\\?\\.data\\)return \\{\\.\\.\\.normalizeOneCompositeEvent\\(cached\\.data\\),stale:true\\}/, 'stale-cache fallback missing');","has(/if\\(cachedData&&rollforwardEligible\\(snap,cachedData,now\\)\\)return \\{\\.\\.\\.cachedData,stale:true\\}/, 'stale-cache fallback missing');")
          ]
          for old,new in pairs:
              assert old in s, f'legacy assertion not found: {old}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify regression syntax
        run: node --check tests/combat-hub-regression.mjs
      - name: Commit test update
        run: |
          git config user.name "chatgpt-combat-hub"
          git config user.email "actions@users.noreply.github.com"
          git add tests/combat-hub-regression.mjs
          git commit -m "test: align cache guards with RC transition logic"
          git push origin HEAD:chatgpt/rc-live-data-hardening-v7.12.0-clean
