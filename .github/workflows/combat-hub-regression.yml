name: COMBAT HUB Regression

on:
  push:
    branches:
      - chatgpt/large-unified-layout

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/large-unified-layout
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply unified Large layout
        run: python3 scripts/apply-large-unified.py
      - name: Focused verification
        run: |
          node --check combat-hub.js
          node --check tests/combat-hub-large-regression.mjs
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-event-transition-regression.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs HANDOFF.md
          git commit -m "feat: unify Large layout across organizations"
          git push origin HEAD:chatgpt/large-unified-layout
