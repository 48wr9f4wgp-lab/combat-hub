name: COMBAT HUB Friends Stable Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-hub-friends-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Friend runtime syntax check
        run: node --check combat-hub.js
      - name: Friend loader syntax check
        run: node --check friend-loader.js
      - name: Friend bootstrap syntax check
        run: node --check friend-bootstrap.js
      - name: Regression-suite syntax check
        run: node --check tests/combat-hub-regression.mjs
      - name: COMBAT HUB friends-stable regression suite
        run: node tests/combat-hub-regression.mjs
