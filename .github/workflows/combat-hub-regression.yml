name: COMBAT HUB Regression

on:
  push:
    branches:
      - chatgpt/medium-unified-v7170

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/medium-unified-v7170
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply v7.17.0 Medium unified layout
        run: python3 scripts/apply-medium-unified-v7170.py
      - name: Focused verification
        run: |
          node --check combat-hub.js
          node --check tests/combat-hub-typography-regression.mjs
          node --check tests/combat-hub-k1-layout-regression.mjs
          node --check tests/combat-hub-large-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          node tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-event-transition-regression.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-typography-regression.mjs tests/combat-hub-k1-layout-regression.mjs tests/combat-hub-large-regression.mjs HANDOFF.md
          git commit -m "feat: unify Medium layout across organizations"
          git push origin HEAD:chatgpt/medium-unified-v7170
