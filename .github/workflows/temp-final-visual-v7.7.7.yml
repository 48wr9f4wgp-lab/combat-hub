name: TEMP Final Visual v7.7.7

on:
  push:
    branches:
      - fix/final-visual-v7.7.7

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/final-visual-v7.7.7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply targeted final visual fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('combat-hub.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'pattern count mismatch: expected {count}, got {n}: {old[:100]}')
              s = s.replace(old, new, count)

          rep('// v7.7.6-github — final visual polish / data engine unchanged',
              '// v7.7.7-github — RIZIN full-name + BOXING center contrast / data engine unchanged')
          rep("const VERSION='7.7.6-github';", "const VERSION='7.7.7-github';")

          old_boxing = "function boxingCenterBand(c){if(KEY!=='boxing')return;const bands=[170,140,110,80,54];for(let i=0;i<bands.length;i++){const w=bands[i],a=.035+i*.018;c.setFillColor(new Color('#000000',a));c.fillRect(new Rect(360-w/2,72,w,220));}}"
          new_boxing = "function boxingCenterBand(c){if(KEY!=='boxing')return;const bands=[190,158,126,96,68];for(let i=0;i<bands.length;i++){const w=bands[i],a=.050+i*.022;c.setFillColor(new Color('#000000',a));c.fillRect(new Rect(360-w/2,64,w,236));}}"
          rep(old_boxing, new_boxing)

          pattern = r"function mainDisplayName\(s\)\{.*?\}\nfunction supportRow"
          replacement = "function mainNameParts(s){const v=String(s||'');if(KEY!=='rizin'||[...v].length<=12)return[v];const chars=[...v],mid=Math.floor(chars.length/2),seps=['・',' ','-','‐','–'];let best=-1,dist=Infinity;chars.forEach((ch,i)=>{if(!seps.includes(ch))return;const d=Math.abs(i-mid);if(d<dist){best=i;dist=d;}});if(best>1&&best<chars.length-2)return[chars.slice(0,best+1).join(''),chars.slice(best+1).join('')];return[chars.slice(0,mid).join(''),chars.slice(mid).join('')];}\nfunction renderMainName(box,name){const parts=mainNameParts(name);for(const part of parts){const t=tx(box,part,V.mainSize,new Color(C.text),'black',1);if(KEY==='rizin'&&parts.length>1)t.minimumScaleFactor=.86;t.centerAlignText();}return parts;}\nfunction supportRow"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'mainDisplayName replacement count={n}')
          s = s2

          left_old = "aBox.addSpacer();const aName=mainDisplayName(ctx.a.name),an=tx(aBox,aName,V.mainSize,new Color(C.text),'black',2);if(KEY==='rizin'&&aName.includes('\\n'))an.minimumScaleFactor=.78;an.centerAlignText();aBox.addSpacer();"
          left_new = "aBox.addSpacer();renderMainName(aBox,ctx.a.name);aBox.addSpacer();"
          right_old = "bBox.addSpacer();const bName=mainDisplayName(ctx.b.name),bn=tx(bBox,bName,V.mainSize,new Color(C.text),'black',2);if(KEY==='rizin'&&bName.includes('\\n'))bn.minimumScaleFactor=.78;bn.centerAlignText();bBox.addSpacer();"
          right_new = "bBox.addSpacer();renderMainName(bBox,ctx.b.name);bBox.addSpacer();"
          rep(left_old, left_new)
          rep(right_old, right_new)
          p.write_text(s, encoding='utf-8')

          rp = Path('tests/combat-hub-regression.mjs')
          r = rp.read_text(encoding='utf-8')
          old = "has(/aBox\\.addSpacer\\(\\);const aName=mainDisplayName\\(ctx\\.a\\.name\\),an=/, 'Left main fighter is not vertically centered');\nhas(/bBox\\.addSpacer\\(\\);const bName=mainDisplayName\\(ctx\\.b\\.name\\),bn=/, 'Right main fighter is not vertically centered');\nhas(/an\\.centerAlignText\\(\\)/, 'Left main fighter is not horizontally centered');\nhas(/bn\\.centerAlignText\\(\\)/, 'Right main fighter is not horizontally centered');"
          new = "has(/aBox\\.addSpacer\\(\\);renderMainName\\(aBox,ctx\\.a\\.name\\);aBox\\.addSpacer\\(\\)/, 'Left main fighter is not vertically centered');\nhas(/bBox\\.addSpacer\\(\\);renderMainName\\(bBox,ctx\\.b\\.name\\);bBox\\.addSpacer\\(\\)/, 'Right main fighter is not vertically centered');\nhas(/function renderMainName\\(box,name\\)\\{[^}]*t\\.centerAlignText\\(\\)/, 'Main fighter text is not horizontally centered');"
          if old not in r:
              raise SystemExit('main regression visual guard block not found')
          r = r.replace(old, new, 1)
          old_expose = "eventPoster,loadData};if(globalThis.__TEST_ONLY__)return;"
          new_expose = "eventPoster,loadData,mainNameParts};if(globalThis.__TEST_ONLY__)return;"
          if old_expose not in r:
              raise SystemExit('runtime internals exposure marker not found')
          r = r.replace(old_expose, new_expose, 1)
          marker = "// ONE composite pages expose the earlier Inner Circle start. Normalize the primary Friday Fights display only once."
          insert = """// RIZIN long main-event names must split into complete lines rather than truncate.\n{\n  const { api } = await boot('RIZIN');\n  assert.deepEqual(Array.from(api.mainNameParts('ラジャブアリ・シェイドゥラエフ')), ['ラジャブアリ・', 'シェイドゥラエフ']);\n  assert.deepEqual(Array.from(api.mainNameParts('AJ・マッキー')), ['AJ・マッキー']);\n}\n\n// ONE composite pages expose the earlier Inner Circle start. Normalize the primary Friday Fights display only once."""
          if marker not in r:
              raise SystemExit('RIZIN test insertion marker not found')
          r = r.replace(marker, insert, 1)
          rp.write_text(r, encoding='utf-8')

          tp = Path('tests/combat-hub-typography-regression.mjs')
          t = tp.read_text(encoding='utf-8')
          t = t.replace("assert.match(src, /const VERSION='7\\.7\\.6-github'/, 'Expected final visual runtime v7.7.6');",
                        "assert.match(src, /const VERSION='7\\.7\\.7-github'/, 'Expected final visual runtime v7.7.7');", 1)
          old_guards = "assert.match(src, /function mainDisplayName\\(s\\)\\{const v=String\\(s\\|\\|''\\);if\\(KEY!=='rizin'\\|\\|\\[\\.\\.\\.v\\]\\.length<=12\\)return v;/, 'RIZIN long-name balancer missing');\nassert.match(src, /if\\(KEY==='rizin'&&aName\\.includes\\('\\\\n'\\)\\)an\\.minimumScaleFactor=\\.78/, 'RIZIN left long-name scale floor missing');\nassert.match(src, /if\\(KEY==='rizin'&&bName\\.includes\\('\\\\n'\\)\\)bn\\.minimumScaleFactor=\\.78/, 'RIZIN right long-name scale floor missing');\nassert.match(src, /function boxingCenterBand\\(c\\)\\{if\\(KEY!=='boxing'\\)return;/, 'BOXING center contrast band missing');"
          new_guards = "assert.match(src, /function mainNameParts\\(s\\)\\{const v=String\\(s\\|\\|''\\);if\\(KEY!=='rizin'\\|\\|\\[\\.\\.\\.v\\]\\.length<=12\\)return\\[v\\];/, 'RIZIN long-name splitter missing');\nassert.match(src, /function renderMainName\\(box,name\\)\\{const parts=mainNameParts\\(name\\);for\\(const part of parts\\)\\{const t=tx\\(box,part,V\\.mainSize,new Color\\(C\\.text\\),'black',1\\);/, 'RIZIN complete-line renderer missing');\nassert.match(src, /if\\(KEY==='rizin'&&parts\\.length>1\\)t\\.minimumScaleFactor=\\.86/, 'RIZIN multiline scale floor missing');\nassert.match(src, /function boxingCenterBand\\(c\\)\\{if\\(KEY!=='boxing'\\)return;const bands=\\[190,158,126,96,68\\]/, 'BOXING center contrast band missing or too weak');"
          if old_guards not in t:
              raise SystemExit('typography final visual guard block not found')
          t = t.replace(old_guards, new_guards, 1)
          tp.write_text(t, encoding='utf-8')

          kp = Path('tests/combat-hub-k1-layout-regression.mjs')
          k = kp.read_text(encoding='utf-8')
          k = k.replace("assert.match(src, /const VERSION='7\\.7\\.6-github'/, 'Expected final visual runtime v7.7.6');",
                        "assert.match(src, /const VERSION='7\\.7\\.7-github'/, 'Expected final visual runtime v7.7.7');", 1)
          kp.write_text(k, encoding='utf-8')
          PY
      - name: Syntax and regression checks
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check tests/combat-hub-regression.mjs
          node --check tests/combat-hub-typography-regression.mjs
          node --check tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-one-composite-regression.mjs
          node tests/combat-hub-ufc-rollforward-regression.mjs
          node tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          git diff --check
      - name: Commit v7.7.7 patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-regression.mjs tests/combat-hub-typography-regression.mjs tests/combat-hub-k1-layout-regression.mjs
          git commit -m "fix: complete RIZIN names and strengthen boxing contrast v7.7.7"
          git push origin HEAD:fix/final-visual-v7.7.7
