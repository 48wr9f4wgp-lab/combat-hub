name: Large V5.2 Readability

on:
  push:
    branches:
      - chatgpt/large-v5-2-readability

jobs:
  readability:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply Large V5.2 readability pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              s=s.replace(old,new,1)

          rep('// v7.11.1-github — Large V5.1 screenshot polish','// v7.11.2-github — Large V5.2 readability pass','version comment')
          rep("const VERSION='7.11.1-github';","const VERSION='7.11.2-github';",'version')
          rep("function largeFightRow(st,row){const r=st.addStack();r.centerAlignContent();const lab=r.addStack();lab.size=new Size(35,0);const lt=tx(lab,jpCardLabel(row.label),6.3,new Color(S.accent),'bold');lt.minimumScaleFactor=.58;r.addSpacer(2);const aa=r.addStack();aa.size=new Size(57,0);const at=tx(aa,jpDisplay(row.a),7.3,new Color(C.text),'semibold');at.minimumScaleFactor=.52;r.addSpacer(2);tx(r,'VS',6.0,new Color(S.accent),'bold');r.addSpacer(2);const bb=r.addStack();bb.size=new Size(57,0);const bt=tx(bb,jpDisplay(row.b),7.3,new Color(C.text),'semibold');bt.minimumScaleFactor=.52;bt.rightAlignText();}","function largeFightRow(st,row){const r=st.addStack();r.centerAlignContent();const lab=r.addStack();lab.size=new Size(38,0);const lt=tx(lab,jpCardLabel(row.label),7.0,new Color(S.accent),'bold');lt.minimumScaleFactor=.64;r.addSpacer(2);const aa=r.addStack();aa.size=new Size(62,0);const at=tx(aa,jpDisplay(row.a),8.4,new Color(C.text),'semibold');at.minimumScaleFactor=.56;r.addSpacer(2);tx(r,'VS',6.8,new Color(S.accent),'bold');r.addSpacer(2);const bb=r.addStack();bb.size=new Size(62,0);const bt=tx(bb,jpDisplay(row.b),8.4,new Color(C.text),'semibold');bt.minimumScaleFactor=.56;bt.rightAlignText();}",'fight row typography')
          rep('w.addSpacer(D.cardTba?34:46)','w.addSpacer(D.cardTba?30:40)','hero vertical compression')
          rep('dash.size=new Size(328,132)','dash.size=new Size(328,154)','dashboard height')
          rep('dash.setPadding(10,8,10,8)','dash.setPadding(10,10,10,10)','dashboard padding')
          rep('left.size=new Size(next?180:212,112)','left.size=new Size(next?184:224,134)','fight pane size')
          rep("tx(ltitle,'対戦カード',6.5,new Color(S.accent),'bold')","tx(ltitle,'対戦カード',7.2,new Color(S.accent),'bold')",'fight heading')
          rep("if(i<rows.length-1){left.addSpacer(3);const sep=left.addStack();sep.size=new Size(0,1);sep.backgroundColor=new Color('#FFFFFF',.055);left.addSpacer(3);}","if(i<rows.length-1){left.addSpacer(5);const sep=left.addStack();sep.size=new Size(0,1);sep.backgroundColor=new Color('#FFFFFF',.055);left.addSpacer(5);}",'row spacing')
          rep('rule.size=new Size(1,104)','rule.size=new Size(1,126)','divider height')
          rep('right.size=new Size(next?117:85,112)','right.size=new Size(next?111:71,134)','next pane size')
          rep("tx(ncap,'次大会',6.4,new Color(S.accent),'bold')","tx(ncap,'次大会',7.1,new Color(S.accent),'bold')",'next heading')
          rep("const nn=tx(right,largeNextTitle(next),8.5,new Color(C.text),'bold',2);nn.minimumScaleFactor=.62;right.addSpacer(5);tx(right,largeNextMeta(next),6.4,new Color(C.sub),'semibold',2);right.addSpacer();const nt=tx(right,'あと '+countdown(next),6.6,new Color(S.accent),'bold');nt.minimumScaleFactor=.58;","const nn=tx(right,largeNextTitle(next),9.6,new Color(C.text),'bold',2);nn.minimumScaleFactor=.64;right.addSpacer(6);tx(right,largeNextMeta(next),7.2,new Color(C.sub),'semibold',2);right.addSpacer();const nt=tx(right,'あと '+countdown(next),7.2,new Color(S.accent),'bold');nt.minimumScaleFactor=.62;",'next typography')
          rep("tx(right,'公式情報を確認中',7.0,new Color(C.muted),'semibold',3)","tx(right,'公式情報を確認中',7.8,new Color(C.muted),'semibold',3)",'pending next typography')
          p.write_text(s)

          t=Path('tests/combat-hub-large-regression.mjs')
          q=t.read_text()
          q=q.replace("assert.match(src, /const VERSION='7\\.11\\.1-github'/);","assert.match(src, /const VERSION='7\\.11\\.2-github'/);")
          q=q.replace("assert.match(src, /dash\\.size=new Size\\(328,132\\)/, 'V5.1 wider editorial rail missing');","assert.match(src, /dash\\.size=new Size\\(328,154\\)/, 'V5.2 taller editorial rail missing');")
          q=q.replace("assert.match(src, /left\\.size=new Size\\(next\\?180:212,112\\)/, 'V5.1 adaptive fight-card pane missing');","assert.match(src, /left\\.size=new Size\\(next\\?184:224,134\\)/, 'V5.2 readable fight-card pane missing');")
          q=q.replace("assert.match(src, /right\\.size=new Size\\(next\\?117:85,112\\)/, 'V5.1 adaptive next-event pane missing');","assert.match(src, /right\\.size=new Size\\(next\\?111:71,134\\)/, 'V5.2 readable next-event pane missing');")
          q=q.replace("assert.match(src, /rule\\.size=new Size\\(1,104\\)/, 'V5 dashboard divider missing');","assert.match(src, /rule\\.size=new Size\\(1,126\\)/, 'V5.2 dashboard divider missing');")
          q=q.replace("console.log('COMBAT HUB Large V5 regression: OK');","assert.match(src, /jpCardLabel\\(row\\.label\\),7\\.0/, 'V5.2 card-label typography missing');\nassert.match(src, /jpDisplay\\(row\\.a\\),8\\.4/, 'V5.2 fighter-name typography missing');\nassert.match(src, /largeNextTitle\\(next\\),9\\.6/, 'V5.2 next-event title typography missing');\nconsole.log('COMBAT HUB Large V5.2 regression: OK');")
          t.write_text(q)
          PY
      - name: Runtime syntax check
        run: node --check combat-hub.js
      - name: Full regression suite
        run: |
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit Large V5.2 readability pass
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add combat-hub.js tests/combat-hub-large-regression.mjs
            git commit -m 'fix: increase Large lower-panel readability'
            git push
          fi
