name: TEMP COMBAT HUB audit v7.8.0

on:
  push:
    branches:
      - audit/live-data-v7.8.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/live-data-v7.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply audited current-data fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'pattern count mismatch {n} != {count}: {old[:120]}')
              s=s.replace(old,new,count)

          rep('// v7.7.7-github — RIZIN full-name + BOXING center contrast / data engine unchanged',
              '// v7.8.0-github — audited current-event truth + safe card refresh')
          rep("const VERSION='7.7.7-github';","const VERSION='7.8.0-github';")

          old_rizin="  rizin:{startAt:'2026-09-10T16:00:00+09:00',location:'大阪',name:'超RIZIN.5',main:{a:'ラジャブアリ・シェイドゥラエフ',b:'AJ・マッキー',context:'フェザー級タイトル戦'},support:[{label:'CO-MAIN',a:'朝倉未来',b:'青木真也'},{label:'FEATURED',a:'ホベルト・サトシ・ソウザ',b:'野村駿太'}],source:'https://jp.rizinff.com/_ct/17834937'},"
          new_rizin="  rizin:{startAt:'2026-09-10T16:00:00+09:00',location:'大阪',name:'超RIZIN.5',main:{a:'ラジャブアリ・シェイドゥラエフ',b:'AJ・マッキー',context:'フェザー級タイトル戦'},support:[{label:'CO-MAIN',a:'朝倉未来',b:'青木真也'},{label:'FEATURED',a:'ホベルト・サトシ・ソウザ',b:'野村駿太'}],source:'https://jp.rizinff.com/_ct/17834937',cardSource:'https://jp.rizinff.com/_ct/17853585',trustedCardSource:true},"
          rep(old_rizin,new_rizin)

          old_one="  one:{startAt:'2026-08-28T20:30:00+09:00',location:'バンコク',name:'ONE Friday Fights 168',cardTba:true,main:{a:'対戦カード',b:'発表待ち',context:'ONE Friday Fights 168'},support:[],source:'https://www.onefc.com/events/one-friday-fights-168/'},"
          new_one="  one:{startAt:'2026-09-04T22:30:00+09:00',location:'バンコク',name:'ONE Friday Fights 169',main:{a:'Petmuangsri Torfunfarm',b:'Gregor Thom',context:'フライ級ムエタイ'},support:[{label:'CO-MAIN',a:'Khunponnoi Sor Sommai',b:'Sunvo Torfunfarm'},{label:'FEATURED',a:'Dansiam Weerasakreck',b:'Hicham Rahmoun'}],source:'https://www.onefc.com/events/one-friday-fights-169/',cardSource:'https://www.onefc.com/news/full-card-revealed-for-one-friday-fights-169-on-september-4/',trustedCardSource:true},"
          rep(old_one,new_one)

          old_k1="  k1:{startAt:'2026-09-12T12:00:00+09:00',location:'東京・代々木第二',name:'K-1 WORLD MAX 2026',main:{a:'金子晃大',b:'璃明武',context:'スーパー・バンタム級タイトル戦'},support:[{label:'TITLE FIGHT',a:'朝久泰央',b:'アラッサン・カマラ'},{label:'TITLE FIGHT',a:'里見柚己',b:'永澤サムエル聖光'}],source:'https://www.k-1.co.jp/k-1wgp/schedule/16669'}"
          new_k1="  k1:{startAt:'2026-09-12T12:00:00+09:00',location:'東京・代々木第二',name:'K-1 WORLD MAX 2026',main:{a:'ジョナス・サルシチャ',b:'ゾーラ・アカピャン',context:'-70kg世界最強決定トーナメント開幕戦'},support:[{label:'TITLE FIGHT',a:'朝久泰央',b:'アラッサン・カマラ'},{label:'PART 1 MAIN',a:'里見柚己',b:'永澤サムエル聖光'}],source:'https://www.k-1.co.jp/k-1wgp/schedule/16669'}"
          rep(old_k1,new_k1)

          old_known="const KNOWN_K1={'金子晃大':'https://www.k-1.co.jp/fighter/716','璃明武':'https://www.k-1.co.jp/k-1wgp/fighter/856'};"
          new_known="const KNOWN_K1={'金子晃大':'https://www.k-1.co.jp/fighter/716','璃明武':'https://www.k-1.co.jp/k-1wgp/fighter/856','ジョナス・サルシチャ':'https://www.k-1.co.jp/fighter/1630','ゾーラ・アカピャン':'https://www.k-1.co.jp/fighter/1451'};"
          rep(old_known,new_known)

          old_fight="function fightPairs(html){const out=[],seen=new Set();for(const m of html.matchAll(/<h[1-4][^>]*>([\\s\\S]*?)<\\/h[1-4]>/gi)){const p=splitFight(m[1]);if(p&&p.a.length<50&&p.b.length<50){const k=p.a+'|'+p.b;if(!seen.has(k)){seen.add(k);out.push(p);}}}if(!out.length){const title=(html.match(/<title[^>]*>([\\s\\S]*?)<\\/title>/i)||[])[1];const p=splitFight(title||'');if(p)out.push(p);}return out.slice(0,6);}\n"
          new_fight=old_fight+"function officialCardPairs(html){const out=[],seen=new Set(),push=p=>{if(!p||!p.a||!p.b)return;const a=cleanName(p.a).split(/\\s*\\/\\s*/)[0].trim(),b=cleanName(p.b).split(/\\s*\\/\\s*/)[0].replace(/\\s*\\([^)]*\\)\\s*$/,'').trim();if(a.length<2||b.length<2||a.length>55||b.length>55)return;const k=a+'|'+b;if(!seen.has(k)){seen.add(k);out.push({a,b});}};for(const p of fightPairs(html))push(p);for(const m of html.matchAll(/<(?:li|p|h[1-6]|a)\\b[^>]*>([\\s\\S]*?)<\\/(?:li|p|h[1-6]|a)>/gi)){let t=stripHTML(m[1]).replace(/\\s*\\([^)]*\\)\\s*$/,'').trim();const x=t.match(/^(.{2,70}?)\\s+(?:vs\\.?|VS|対)\\s+(.{2,70}?)(?:\\s*\\(|$)/i);if(x)push({a:x[1],b:x[2]});}return out.slice(0,8);}\nfunction sameFight(a,b,x,y){const n=v=>String(v||'').toLowerCase().replace(/[\\s・.'’_-]+/g,'');return(n(a)===n(x)&&n(b)===n(y))||(n(a)===n(y)&&n(b)===n(x));}\n"
          rep(old_fight,new_fight)

          old_lock="function currentLocked(snap){const end=new Date(snap.startAt).getTime()+12*3600000;return Date.now()<end;}\n"
          new_lock=old_lock+"async function refreshLockedCurrent(snap){const url=snap.cardSource||snap.source,path=cacheFile(`combat-hub-current-${KEY}.json`),cached=readJSON(path),now=Date.now();if(cached?.data&&now-Number(cached.savedAt)<2*3600000)return{...snap,...cached.data};try{const html=await reqText(url,8),pairs=officialCardPairs(html);let data={};if(url===snap.source){const imageURL=metaImage(html,url);if(imageURL)data.posterURL=imageURL;}if(pairs.length&&(snap.trustedCardSource||sameFight(pairs[0].a,pairs[0].b,snap.main.a,snap.main.b))){data.main={...snap.main,a:pairs[0].a,b:pairs[0].b};data.support=pairs.slice(1,3).map((p,i)=>({label:i?'FEATURED':'CO-MAIN',a:p.a,b:p.b}));data.cardTba=false;}writeJSON(path,{savedAt:now,data});return{...snap,...data};}catch(_){return snap;}}\n"
          rep(old_lock,new_lock)

          old_load="async function loadData(){const snap=normalizeOneCompositeEvent({...SNAPSHOT[KEY]});if(currentLocked(snap)){snap.posterURL=await cachedMetaImageURL(snap.source,`${KEY}-event`,4*3600000);snap.lockedCurrent=true;return snap;}"
          new_load="async function loadData(){const snap=normalizeOneCompositeEvent({...SNAPSHOT[KEY]});if(currentLocked(snap)){const current=await refreshLockedCurrent(snap);if(!current.posterURL)current.posterURL=await cachedMetaImageURL(snap.source,`${KEY}-event`,4*3600000);current.lockedCurrent=true;return current;}"
          rep(old_load,new_load)

          p.write_text(s,encoding='utf-8')

          # Main regression: accept audited runtime, update current truth, and expose refresh helpers.
          rp=Path('tests/combat-hub-regression.mjs')
          r=rp.read_text(encoding='utf-8')
          r=r.replace("has(/const VERSION='7\\.7\\.\\d+-github'/, 'Expected v7.7 reliability runtime');","has(/const VERSION='7\\.8\\.0-github'/, 'Expected audited v7.8.0 runtime');",1)
          r=r.replace('  one: "2026-08-28T20:30:00+09:00",','  one: "2026-09-04T22:30:00+09:00",',1)
          marker="for (const [key, iso] of Object.entries(expected)) {\n  assert.ok(src.includes(`${key}:{startAt:'${iso}'`), `${key} snapshot startAt drifted: ${iso}`);\n}\n"
          extra=marker+"assert.ok(src.includes(\"name:'ONE Friday Fights 169'\"), 'ONE current event stale');\nassert.ok(src.includes(\"main:{a:'Petmuangsri Torfunfarm',b:'Gregor Thom',context:'フライ級ムエタイ'}\"), 'ONE current main stale');\nassert.ok(src.includes(\"cardSource:'https://www.onefc.com/news/full-card-revealed-for-one-friday-fights-169-on-september-4/'\"), 'ONE official card source missing');\nassert.ok(src.includes(\"main:{a:'ジョナス・サルシチャ',b:'ゾーラ・アカピャン',context:'-70kg世界最強決定トーナメント開幕戦'}\"), 'K-1 current main stale');\n"
          if marker not in r: raise SystemExit('snapshot marker missing')
          r=r.replace(marker,extra,1)
          r=r.replace("has(/function currentLocked\\(snap\\)\\{const end=new Date\\(snap\\.startAt\\)\\.getTime\\(\\)\\+12\\*3600000;return Date\\.now\\(\\)<end;\\}/, '12h current-event lock guard missing');",
                      "has(/function currentLocked\\(snap\\)\\{const end=new Date\\(snap\\.startAt\\)\\.getTime\\(\\)\\+12\\*3600000;return Date\\.now\\(\\)<end;\\}/, '12h current-event lock guard missing');\nhas(/async function refreshLockedCurrent\\(snap\\)/, 'current-event official refresh missing');\nhas(/combat-hub-current-\\$\\{KEY\\}\\.json/, 'current-event refresh cache missing');",1)
          r=r.replace("globalThis.__combatInternals={absoluteURL,validOrgName,normalizeOneCompositeEvent,strictNextEvent,jsonLdEvents,links,metaImage,heroContext,eventPoster,loadData,mainNameParts};",
                      "globalThis.__combatInternals={absoluteURL,validOrgName,normalizeOneCompositeEvent,strictNextEvent,jsonLdEvents,links,metaImage,heroContext,eventPoster,loadData,mainNameParts,officialCardPairs,refreshLockedCurrent};",1)
          insert_after="  assert.deepEqual(Array.from(api.mainNameParts('AJ・マッキー')), ['AJ・マッキー']);\n}\n"
          refresh_test=insert_after+"\n// Trusted current-card feeds must parse official list items and refresh a locked snapshot safely.\n{\n  const cardSource='https://www.onefc.com/news/full-card-revealed-for-one-friday-fights-169-on-september-4/';\n  const html='<ul><li>Petmuangsri Torfunfarm vs. Gregor Thom (Muay Thai – flyweight)</li><li>Khunponnoi Sor Sommai vs. Sunvo Torfunfarm (Muay Thai – flyweight)</li><li>Dansiam Weerasakreck vs. Hicham Rahmoun (Muay Thai – featherweight)</li></ul>';\n  const { api }=await boot('ONE',{now:Date.parse('2026-09-02T18:00:00+09:00'),textResponses:{[cardSource]:html}});\n  const pairs=api.officialCardPairs(html);\n  assert.equal(pairs[0].a,'Petmuangsri Torfunfarm');\n  assert.equal(pairs[0].b,'Gregor Thom');\n  const current=await api.refreshLockedCurrent({startAt:'2026-09-04T22:30:00+09:00',source:'https://www.onefc.com/events/one-friday-fights-169/',cardSource,trustedCardSource:true,main:{a:'Petmuangsri Torfunfarm',b:'Gregor Thom',context:'フライ級ムエタイ'},support:[]});\n  assert.equal(current.main.a,'Petmuangsri Torfunfarm');\n  assert.equal(current.support[0].a,'Khunponnoi Sor Sommai');\n}\n"
          if insert_after not in r: raise SystemExit('RIZIN test insertion marker missing')
          r=r.replace(insert_after,refresh_test,1)
          r=r.replace("console.log('COMBAT HUB v7.7 regression checks: OK');","console.log('COMBAT HUB v7.8.0 regression checks: OK');",1)
          rp.write_text(r,encoding='utf-8')

          # Version-only compatibility updates in focused suites.
          for fn in ['tests/combat-hub-one-composite-regression.mjs','tests/combat-hub-k1-layout-regression.mjs','tests/combat-hub-typography-regression.mjs']:
              q=Path(fn); t=q.read_text(encoding='utf-8')
              t=t.replace("/const VERSION='7\\.7\\.\\d+-github'/", "/const VERSION='7\\.8\\.0-github'/")
              t=t.replace("/const VERSION='7\\.7\\.7-github'/", "/const VERSION='7\\.8\\.0-github'/")
              t=t.replace('runtime version should stay on v7.7 patch line','runtime version should be audited v7.8.0')
              t=t.replace('Expected final visual runtime v7.7.7','Expected audited runtime v7.8.0')
              q.write_text(t,encoding='utf-8')

          # Cache suite keeps the same poster-cache contract but now runs after a current refresh.
          cp=Path('tests/combat-hub-cache-regression.mjs')
          c=cp.read_text(encoding='utf-8')
          c=c.replace("assert.match(src, /cachedMetaImageURL\\(snap\\.source,`\\$\\{KEY\\}-event`,4\\*3600000\\)/, 'locked-event metadata cache must remain 4h');",
                      "assert.match(src, /cachedMetaImageURL\\(snap\\.source,`\\$\\{KEY\\}-event`,4\\*3600000\\)/, 'locked-event metadata cache must remain 4h');\nassert.match(src, /combat-hub-current-\\$\\{KEY\\}\\.json/, 'locked current-card refresh cache missing');",1)
          cp.write_text(c,encoding='utf-8')

          # Add audited data suite.
          Path('tests/combat-hub-current-data-audit.mjs').write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst src=fs.readFileSync('combat-hub.js','utf8');\nassert.match(src,/const VERSION='7\\.8\\.0-github'/);\nassert.match(src,/one:\{startAt:'2026-09-04T22:30:00\\+09:00'[^\\n]*name:'ONE Friday Fights 169'[^\\n]*Petmuangsri Torfunfarm[^\\n]*Gregor Thom/);\nassert.doesNotMatch(src,/one:\{startAt:'2026-08-28T20:30:00\\+09:00'/);\nassert.match(src,/cardSource:'https:\\/\\/www\\.onefc\\.com\\/news\\/full-card-revealed-for-one-friday-fights-169-on-september-4\\/'/);\nassert.match(src,/k1:\{startAt:'2026-09-12T12:00:00\\+09:00'[^\\n]*ジョナス・サルシチャ[^\\n]*ゾーラ・アカピャン/);\nassert.doesNotMatch(src,/k1:\{startAt:'2026-09-12T12:00:00\\+09:00'[^\\n]*main:\{a:'金子晃大',b:'璃明武'/);\nassert.match(src,/'ジョナス・サルシチャ':'https:\\/\\/www\\.k-1\\.co\\.jp\\/fighter\\/1630'/);\nassert.match(src,/'ゾーラ・アカピャン':'https:\\/\\/www\\.k-1\\.co\\.jp\\/fighter\\/1451'/);\nassert.match(src,/async function refreshLockedCurrent\\(snap\\)/);\nconsole.log('COMBAT HUB current-data audit regression: OK');\n""",encoding='utf-8')

          # Wire audit suite into normal CI.
          wp=Path('.github/workflows/combat-hub-regression.yml')
          w=wp.read_text(encoding='utf-8')
          needle="      - name: Typography regression syntax check\n        run: node --check tests/combat-hub-typography-regression.mjs\n"
          repl=needle+"      - name: Current-data audit syntax check\n        run: node --check tests/combat-hub-current-data-audit.mjs\n"
          if needle not in w: raise SystemExit('workflow syntax marker missing')
          w=w.replace(needle,repl,1)
          needle2="      - name: COMBAT HUB typography suite\n        run: node tests/combat-hub-typography-regression.mjs\n"
          repl2=needle2+"      - name: COMBAT HUB current-data audit suite\n        run: node tests/combat-hub-current-data-audit.mjs\n"
          if needle2 not in w: raise SystemExit('workflow run marker missing')
          w=w.replace(needle2,repl2,1)
          wp.write_text(w,encoding='utf-8')
          PY
      - name: Syntax and regression checks
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check combat-hub-preview-loader.js
          for f in tests/*.mjs; do node --check "$f"; done
          node tests/combat-hub-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-one-composite-regression.mjs
          node tests/combat-hub-ufc-rollforward-regression.mjs
          node tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          node tests/combat-hub-current-data-audit.mjs
          git diff --check
      - name: Commit audited changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests .github/workflows/combat-hub-regression.yml
          git commit -m "fix: audit live fight data and current-card refresh v7.8.0"
          git push origin HEAD:audit/live-data-v7.8.0
