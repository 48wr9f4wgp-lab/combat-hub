name: One-shot BOXING Medium sync patch

on:
  push:
    branches:
      - chatgpt/boxing-medium-sync-audit-v7.12.6
    paths:
      - tools/patch-boxing-medium-sync-v7.12.6.mjs
      - .github/workflows/zz-apply-boxing-medium-sync.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-medium-sync-audit-v7.12.6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply patch
        run: node tools/patch-boxing-medium-sync-v7.12.6.mjs
      - name: Syntax check
        run: |
          node --check combat-hub.js
          node --check tests/combat-hub-large-regression.mjs
      - name: Focused regression
        run: node tests/combat-hub-large-regression.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git commit -m "fix: harden BOXING Medium and add runtime sync audit"
          git push
