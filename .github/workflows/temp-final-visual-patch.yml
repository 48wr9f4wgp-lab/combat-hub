name: TEMP Final Visual Patch

on:
  push:
    branches:
      - polish/final-visual-v7.7.6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: polish/final-visual-v7.7.6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply targeted visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=None):
              global s
              n = s.count(old)
              if count is not None and n != count:
                  raise SystemExit(f'pattern count mismatch: expected {count}, got {n}: {old[:80]}')
              if n == 0:
                  raise SystemExit(f'pattern not found: {old[:80]}')
              s = s.replace(old, new)

          rep('// v7.7.5-github — typography/readability scale / verified layout preserved',
              '// v7.7.6-github — final visual polish / data engine unchanged', 1)
          rep("const VERSION='7.7.5-github';", "const VERSION='7.7.6-github';", 1)

          rep(
              "function softCenter(c,color,alpha){const bands=[84,60,40,24,10];for(let i=0;i<bands.length;i++){const w=bands[i],a=alpha*((i+1)/bands.length)*.34;c.setFillColor(new Color(color,a));c.fillRect(new Rect(360-w/2,0,w,338));}}\n",
              "function softCenter(c,color,alpha){const bands=[84,60,40,24,10];for(let i=0;i<bands.length;i++){const w=bands[i],a=alpha*((i+1)/bands.length)*.34;c.setFillColor(new Color(color,a));c.fillRect(new Rect(360-w/2,0,w,338));}}\nfunction boxingCenterBand(c){if(KEY!=='boxing')return;const bands=[170,140,110,80,54];for(let i=0;i<bands.length;i++){const w=bands[i],a=.035+i*.018;c.setFillColor(new Color('#000000',a));c.fillRect(new Rect(360-w/2,72,w,220));}}\n",
              1,
          )
          rep(
              "softBand(c,0,112,V.headerShade,24);softBand(c,96,232,V.mainShade,24);softBand(c,214,338,V.footShade,24);softCenter(c,S.accent,V.veil);return c.getImage();}",
              "softBand(c,0,112,V.headerShade,24);softBand(c,96,232,V.mainShade,24);softBand(c,214,338,V.footShade,24);boxingCenterBand(c);softCenter(c,S.accent,V.veil);return c.getImage();}",
              2,
          )

          rep(
              "function supportFont(s){const n=[...String(s||'')].length;return n>13?8.7:n>10?9.2:9.8;}\n",
              "function supportFont(s){const n=[...String(s||'')].length;return n>13?8.7:n>10?9.2:9.8;}\nfunction mainDisplayName(s){const v=String(s||'');if(KEY!=='rizin'||[...v].length<=12)return v;const chars=[...v],mid=Math.floor(chars.length/2),seps=['・',' ','-','‐','–'];let best=-1,dist=Infinity;chars.forEach((ch,i)=>{if(!seps.includes(ch))return;const d=Math.abs(i-mid);if(d<dist){best=i;dist=d;}});if(best>1&&best<chars.length-2)return chars.slice(0,best+1).join('')+'\\n'+chars.slice(best+1).join('');return chars.slice(0,mid).join('')+'\\n'+chars.slice(mid).join('');}\n",
              1,
          )
          rep(
              "const foot=w.addStack();foot.addSpacer();tx(foot,'公式更新を自動反映',6.8,new Color(C.muted),'semibold');foot.addSpacer();",
              "const foot=w.addStack();foot.addSpacer();const footColor=KEY==='one'?new Color('#E0E4EA',.82):new Color(C.muted);tx(foot,'公式更新を自動反映',6.8,footColor,'semibold');foot.addSpacer();",
              1,
          )
          rep(
              "const an=tx(aBox,ctx.a.name,V.mainSize,new Color(C.text),'black',2);an.centerAlignText();",
              "const aName=mainDisplayName(ctx.a.name),an=tx(aBox,aName,V.mainSize,new Color(C.text),'black',2);if(KEY==='rizin'&&aName.includes('\\n'))an.minimumScaleFactor=.78;an.centerAlignText();",
              1,
          )
          rep(
              "const bn=tx(bBox,ctx.b.name,V.mainSize,new Color(C.text),'black',2);bn.centerAlignText();",
              "const bName=mainDisplayName(ctx.b.name),bn=tx(bBox,bName,V.mainSize,new Color(C.text),'black',2);if(KEY==='rizin'&&bName.includes('\\n'))bn.minimumScaleFactor=.78;bn.centerAlignText();",
              1,
          )
          p.write_text(s, encoding='utf-8')

          rp = Path('tests/combat-hub-regression.mjs')
          r = rp.read_text(encoding='utf-8')
          old = r"has(/aBox\.addSpacer\(\);const an=/, 'Left main fighter is not vertically centered');"
          new = r"has(/aBox\.addSpacer\(\);const aName=mainDisplayName\(ctx\.a\.name\),an=/, 'Left main fighter is not vertically centered');"
          if old not in r: raise SystemExit('left vertical-centering guard not found')
          r = r.replace(old, new, 1)
          old = r"has(/bBox\.addSpacer\(\);const bn=/, 'Right main fighter is not vertically centered');"
          new = r"has(/bBox\.addSpacer\(\);const bName=mainDisplayName\(ctx\.b\.name\),bn=/, 'Right main fighter is not vertically centered');"
          if old not in r: raise SystemExit('right vertical-centering guard not found')
          rp.write_text(r.replace(old, new, 1), encoding='utf-8')

          tp = Path('tests/combat-hub-typography-regression.mjs')
          t = tp.read_text(encoding='utf-8')
          old = "assert.match(src, /const VERSION='7\\.7\\.5-github'/, 'Expected readability runtime v7.7.5');"
          new = "assert.match(src, /const VERSION='7\\.7\\.6-github'/, 'Expected final visual runtime v7.7.6');"
          if old not in t: raise SystemExit('typography version guard not found')
          t = t.replace(old, new, 1)
          marker = "// Geometry remains frozen: readability pass must not move the verified card structure."
          insert = """// Final visual polish guards.\nassert.match(src, /function mainDisplayName\\(s\\)\\{const v=String\\(s\\|\\|''\\);if\\(KEY!=='rizin'\\|\\|\\[\\.\\.\\.v\\]\\.length<=12\\)return v;/, 'RIZIN long-name balancer missing');\nassert.match(src, /if\\(KEY==='rizin'&&aName\\.includes\\('\\\\n'\\)\\)an\\.minimumScaleFactor=\\.78/, 'RIZIN left long-name scale floor missing');\nassert.match(src, /if\\(KEY==='rizin'&&bName\\.includes\\('\\\\n'\\)\\)bn\\.minimumScaleFactor=\\.78/, 'RIZIN right long-name scale floor missing');\nassert.match(src, /function boxingCenterBand\\(c\\)\\{if\\(KEY!=='boxing'\\)return;/, 'BOXING center contrast band missing');\nassert.equal((src.match(/boxingCenterBand\\(c\\);softCenter/g) || []).length, 2, 'BOXING center contrast must apply to hero and poster backgrounds');\nassert.match(src, /const footColor=KEY==='one'\\?new Color\\('#E0E4EA',\\.82\\):new Color\\(C\\.muted\\)/, 'ONE footer contrast polish missing');\n\n// Geometry remains frozen: final visual pass must not move the verified card structure."""
          if marker not in t: raise SystemExit('typography geometry marker not found')
          t = t.replace(marker, insert, 1)
          tp.write_text(t, encoding='utf-8')

          kp = Path('tests/combat-hub-k1-layout-regression.mjs')
          k = kp.read_text(encoding='utf-8')
          old = "assert.match(src, /const VERSION='7\\.7\\.5-github'/, 'Expected readability runtime v7.7.5');"
          new = "assert.match(src, /const VERSION='7\\.7\\.6-github'/, 'Expected final visual runtime v7.7.6');"
          if old not in k: raise SystemExit('K-1 version guard not found')
          kp.write_text(k.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Syntax and regression checks
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check tests/combat-hub-regression.mjs
          node --check tests/combat-hub-typography-regression.mjs
          node --check tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-one-composite-regression.mjs
          node tests/combat-hub-ufc-rollforward-regression.mjs
          node tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-regression.mjs tests/combat-hub-typography-regression.mjs tests/combat-hub-k1-layout-regression.mjs
          git commit -m "polish: finalize visual hierarchy v7.7.6"
          git push origin HEAD:polish/final-visual-v7.7.6
