name: Large v7.9.3 polish

on:
  push:
    branches: [chatgpt/large-v793-polish]
    paths: [.large-v793-trigger]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/large-v793-polish
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Large visual polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()

          s=s.replace("// v7.9.2-github — Japanese UI + Large V3.1 polish", "// v7.9.3-github — Large V3.2 visual polish", 1)
          s=s.replace("const VERSION='7.9.2-github';", "const VERSION='7.9.3-github';", 1)

          s=s.replace("function largePortraitSlot(image,side){const W=300,H=440,", "function largePortraitSlot(image,side){const W=300,H=520,", 1)
          s=s.replace("new Rect(18,0,300,440)", "new Rect(18,0,300,520)", 1)
          s=s.replace("new Rect(402,0,300,440)", "new Rect(402,0,300,520)", 1)

          oldfade="for(let i=0;i<96;i++){const p=i/95,a=.045+Math.pow(p,1.45)*.94;c.setFillColor(new Color('#050609',Math.min(.985,a)));c.fillRect(new Rect(0,328+i*2,720,3));}"
          newfade="for(let i=0;i<192;i++){const p=i/191,a=.035+Math.pow(p,1.52)*.95;c.setFillColor(new Color('#050609',Math.min(.99,a)));c.fillRect(new Rect(0,328+i,720,1));}"
          if oldfade not in s: raise SystemExit('Large fade anchor missing')
          s=s.replace(oldfade,newfade,1)

          s=s.replace("const mt=tx(center,'メインイベント',6.0,new Color(S.accent),'bold');", "const mt=tx(center,'メイン',6.8,new Color(S.accent),'bold');", 1)
          s=s.replace("const mt=tx(centerBox,'メインイベント',6.1,new Color(S.accent),'bold');", "const mt=tx(centerBox,'メイン',6.8,new Color(S.accent),'bold');", 1)
          p.write_text(s)

          for fp in ['tests/combat-hub-current-data-audit.mjs','tests/combat-hub-large-regression.mjs']:
            t=Path(fp); q=t.read_text(); q=q.replace("7\\.9\\.2-github", "7\\.9\\.3-github"); t.write_text(q)

          t=Path('tests/combat-hub-large-regression.mjs')
          q=t.read_text()
          q=q.replace("new Rect\\(18,0,300,440\\)", "new Rect\\(18,0,300,520\\)")
          q=q.replace("new Rect\\(402,0,300,440\\)", "new Rect\\(402,0,300,520\\)")
          q=q.replace("for\\(let i=0;i<96;i\\+\\+\\)", "for\\(let i=0;i<192;i\\+\\+\\)")
          q=q.replace("'メインイベント'", "'メイン'")
          t.write_text(q)

          r=Path('tests/combat-hub-regression.mjs')
          q=r.read_text()
          q=q.replace("'メインイベント',6\\.1,new Color\\(S\\.accent\\),'bold'", "'メイン',6\\.8,new Color\\(S\\.accent\\),'bold'")
          q=q.replace("Japanese main-event emphasis label missing", "Japanese main label missing")
          r.write_text(q)
          PY
      - name: Run syntax and regression suite
        run: |
          node --check combat-hub.js
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-current-data-audit.mjs tests/combat-hub-large-regression.mjs tests/combat-hub-regression.mjs
          git commit -m 'fix: smooth large hero transition and improve Japanese main label' || exit 0
          git push origin HEAD:chatgpt/large-v793-polish
