name: Apply Large bottom polish

on:
  push:
    branches:
      - chatgpt/large-bottom-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/large-bottom-polish
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Apply screenshot-driven polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text()
          pairs = [
            ("// v7.13.0-github — Large readability / hierarchy pass; BOXING cache-only path preserved", "// v7.13.1-github — Large lower-panel readability polish; BOXING cache-only path preserved"),
            ("const VERSION='7.13.0-github';", "const VERSION='7.13.1-github';"),
            ("function largeFightRow(st,row,wide=false){const r=st.addStack();r.centerAlignContent();const lab=r.addStack();lab.size=new Size(wide?44:34,0);const lt=tx(lab,jpCardLabel(row.label),wide?8.4:7.8,new Color(S.accent),'bold');lt.minimumScaleFactor=.68;r.addSpacer(3);const aa=r.addStack();aa.size=new Size(wide?104:60,0);const at=tx(aa,jpDisplay(row.a),wide?10.4:9.5,new Color(C.text),'semibold');at.minimumScaleFactor=.62;r.addSpacer(3);tx(r,'VS',wide?8.2:7.6,new Color(S.accent),'bold');r.addSpacer(3);const bb=r.addStack();bb.size=new Size(wide?104:60,0);const bt=tx(bb,jpDisplay(row.b),wide?10.4:9.5,new Color(C.text),'semibold');bt.minimumScaleFactor=.62;bt.rightAlignText();}",
             "function largeFightRow(st,row,wide=false){const block=st.addStack();block.layoutVertically();const lab=block.addStack();const lt=tx(lab,jpCardLabel(row.label),wide?8.6:8.0,new Color(S.accent),'bold');lt.minimumScaleFactor=.74;lab.addSpacer();block.addSpacer(2);const r=block.addStack();r.centerAlignContent();const aa=r.addStack();aa.size=new Size(wide?124:79,0);const at=tx(aa,jpDisplay(row.a),wide?10.8:9.8,new Color(C.text),'semibold',2);at.minimumScaleFactor=.72;r.addSpacer(4);tx(r,'VS',wide?8.4:7.8,new Color(S.accent),'bold');r.addSpacer(4);const bb=r.addStack();bb.size=new Size(wide?124:79,0);const bt=tx(bb,jpDisplay(row.b),wide?10.8:9.8,new Color(C.text),'semibold',2);bt.minimumScaleFactor=.72;bt.rightAlignText();}"),
            ("const rows=(D.support||[]).slice(0,2),compactBoxing=KEY==='boxing'&&!next&&rows.length<=1,dashHeight=compactBoxing?122:142;", "const rows=(D.support||[]).slice(0,2),compactBoxing=KEY==='boxing'&&!next&&rows.length<=1,dashHeight=compactBoxing?126:150;"),
            ("left.size=new Size(compactBoxing?308:(next?176:204),dashHeight-20);", "left.size=new Size(compactBoxing?308:(next?194:204),dashHeight-20);"),
            ("const ltitle=left.addStack();tx(ltitle,'対戦カード',8.4,new Color(S.accent),'bold');ltitle.addSpacer();", "const ltitle=left.addStack();tx(ltitle,'対戦カード',8.8,new Color(S.accent),'bold');ltitle.addSpacer();"),
            ("if(rows.length){rows.forEach((row,i)=>{largeFightRow(left,row,compactBoxing);if(i<rows.length-1){left.addSpacer(8);const sep=left.addStack();sep.size=new Size(0,1);sep.backgroundColor=new Color('#FFFFFF',.07);left.addSpacer(8);}});}", "if(rows.length){rows.forEach((row,i)=>{largeFightRow(left,row,compactBoxing);if(i<rows.length-1){left.addSpacer(6);const sep=left.addStack();sep.size=new Size(0,1);sep.backgroundColor=new Color('#FFFFFF',.07);left.addSpacer(6);}});}"),
            ("dash.addSpacer(6);const rule=dash.addStack();rule.size=new Size(1,112);rule.backgroundColor=new Color('#FFFFFF',.09);dash.addSpacer(6);", "dash.addSpacer(6);const rule=dash.addStack();rule.size=new Size(1,120);rule.backgroundColor=new Color('#FFFFFF',.09);dash.addSpacer(6);"),
            ("const right=dash.addStack();right.layoutVertically();right.size=new Size(next?119:91,122);right.cornerRadius=12;if(nextPoster)right.backgroundImage=largeMiniPoster(nextPoster);right.setPadding(7,7,7,7);", "const right=dash.addStack();right.layoutVertically();right.size=new Size(next?101:91,130);right.cornerRadius=12;right.backgroundColor=new Color('#090C12',.98);right.borderWidth=.6;right.borderColor=new Color(S.accent,.16);right.setPadding(8,8,8,8);"),
            ("if(next){right.addSpacer(7);const nn=tx(right,largeNextTitle(next),10.8,new Color(C.text),'bold',2);nn.minimumScaleFactor=.68;right.addSpacer(7);const nm=tx(right,largeNextMeta(next),8.4,new Color(C.sub),'semibold',2);nm.minimumScaleFactor=.68;right.addSpacer();const nt=tx(right,'あと '+countdown(next),8.6,new Color(S.accent),'bold');nt.minimumScaleFactor=.66;}", "if(next){right.addSpacer(7);const nn=tx(right,largeNextTitle(next),11.2,new Color(C.text),'bold',2);nn.minimumScaleFactor=.72;right.addSpacer(7);const nm=tx(right,largeNextMeta(next),8.6,new Color(C.sub),'semibold',2);nm.minimumScaleFactor=.72;right.addSpacer();const nt=tx(right,'あと '+countdown(next),9.0,new Color(S.accent),'bold');nt.minimumScaleFactor=.70;}"),
            ("const NEXT_POSTER=IS_LARGE&&NEXT&&!BOXING_LARGE?await eventPoster(NEXT):null;", "const NEXT_POSTER=null;")
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('missing combat-hub replacement: ' + old[:100])
              s = s.replace(old, new, 1)
          p.write_text(s)

          tp = Path('tests/combat-hub-large-regression.mjs')
          t = tp.read_text()
          test_pairs = [
            ("const VERSION='7\\.13\\.0-github'", "const VERSION='7\\.13\\.1-github'"),
            ("dashHeight=compactBoxing\\?122:142", "dashHeight=compactBoxing\\?126:150"),
            ("next\\?176:204", "next\\?194:204"),
            ("right\\.size=new Size\\(next\\?119:91,122\\)", "right\\.size=new Size\\(next\\?101:91,130\\)"),
            ("rule\\.size=new Size\\(1,112\\)", "rule\\.size=new Size\\(1,120\\)"),
            ("jpCardLabel\\(row\\.label\\),wide\\?8\\.4:7\\.8", "jpCardLabel\\(row\\.label\\),wide\\?8\\.6:8\\.0"),
            ("jpDisplay\\(row\\.a\\),wide\\?10\\.4:9\\.5", "jpDisplay\\(row\\.a\\),wide\\?10\\.8:9\\.8"),
            ("largeNextTitle\\(next\\),10\\.8", "largeNextTitle\\(next\\),11\\.2"),
            ("NEXT_POSTER=IS_LARGE&&NEXT&&!BOXING_LARGE\\?await eventPoster\\(NEXT\\):null", "NEXT_POSTER=null"),
            ("console.log('COMBAT HUB Large v7.13 readability + BOXING safety regression: OK');", "console.log('COMBAT HUB Large v7.13.1 lower-panel polish + BOXING safety regression: OK');")
          ]
          for old, new in test_pairs:
              if old not in t:
                  raise SystemExit('missing test replacement: ' + old)
              t = t.replace(old, new, 1)
          insert = "assert.match(src, /right\\.backgroundColor=new Color\\('#090C12',\\.98\\)/, 'Next-event pane must suppress noisy poster text');\nassert.match(src, /jpDisplay\\(row\\.a\\),wide\\?10\\.8:9\\.8[\\s\\S]*'semibold',2/, 'Fight names must allow two readable lines');\n"
          marker = "assert.match(src, /function largeNextTitle\\(next\\)/, 'Compact next-event title helper missing');\n"
          if marker not in t:
              raise SystemExit('test insert marker missing')
          t = t.replace(marker, marker + insert, 1)
          tp.write_text(t)
          PY
          node --check combat-hub.js
          node tests/combat-hub-large-regression.mjs
      - name: Commit final branch state
        shell: bash
        run: |
          rm .github/workflows/large-bottom-polish-apply.yml
          git config user.name "48wr9f4wgp-lab"
          git config user.email "48wr9f4wgp@privaterelay.appleid.com"
          git add -A
          git commit -m "feat: polish Large lower dashboard readability"
          git push origin HEAD:chatgpt/large-bottom-polish
