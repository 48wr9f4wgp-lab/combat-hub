name: JA UI v7.9.2

on:
  push:
    branches: [chatgpt/ja-ui-v7.9.2]
    paths: [.ja-ui-trigger]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/ja-ui-v7.9.2
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Japanese UI and fade polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()

          s=s.replace("// v7.9.1-github — Large V3 visual/data polish", "// v7.9.2-github — Japanese UI + Large V3.1 polish", 1)
          s=s.replace("const VERSION='7.9.1-github';", "const VERSION='7.9.2-github';", 1)

          anchor="function cleanName(s){return stripHTML(s).replace(/^(?:MAIN EVENT|CO-?MAIN|FEATURED|TITLE FIGHT)\\s*/i,'').replace(/\\s+/g,' ').trim();}"
          helper="function jpCardLabel(label){const v=String(label||'').trim().toUpperCase();if(v==='CO-MAIN')return'セミ';if(v==='MAIN CARD')return'本戦';if(v==='FEATURED')return'注目';if(v==='TITLE FIGHT')return'タイトル戦';if(v==='UNDERCARD')return'前座';return String(label||'');}"
          if 'function jpCardLabel(label)' not in s:
            if anchor not in s: raise SystemExit('cleanName anchor missing')
            s=s.replace(anchor,anchor+'\n'+helper,1)

          s=s.replace("tx(l,row.label,7.1,new Color(S.accent),'bold');", "tx(l,jpCardLabel(row.label),7.1,new Color(S.accent),'bold');", 1)
          s=s.replace("const lt=tx(lab,row.label,6.0,new Color(S.accent),'bold');", "const lt=tx(lab,jpCardLabel(row.label),6.0,new Color(S.accent),'bold');", 1)
          s=s.replace("tx(center,'MAIN EVENT',6.0,new Color(S.accent),'bold')", "tx(center,'メインイベント',6.0,new Color(S.accent),'bold')", 1)
          s=s.replace("tx(centerBox,'MAIN EVENT',6.1,new Color(S.accent),'bold')", "tx(centerBox,'メインイベント',6.1,new Color(S.accent),'bold')", 1)
          s=s.replace("largeDashLabel(card,'FIGHT CARD');", "largeDashLabel(card,'対戦カード');", 1)
          s=s.replace("tx(ncap,'NEXT',6.6,new Color(S.accent),'bold');", "tx(ncap,'次大会',6.6,new Color(S.accent),'bold');", 1)
          s=s.replace("next.name||'NEXT EVENT'", "next.name||'次大会'", 1)
          s=s.replace("KEY==='boxing'?'UNDERCARD 発表待ち':'追加カード発表待ち'", "KEY==='boxing'?'前座カード発表待ち':'追加カード発表待ち'", 1)

          oldfade="for(let i=0;i<34;i++){const p=i/33,a=.055+Math.pow(p,1.35)*.93;c.setFillColor(new Color('#050609',Math.min(.985,a)));c.fillRect(new Rect(0,326+i*6,720,8));}"
          newfade="for(let i=0;i<96;i++){const p=i/95,a=.045+Math.pow(p,1.45)*.94;c.setFillColor(new Color('#050609',Math.min(.985,a)));c.fillRect(new Rect(0,328+i*2,720,3));}"
          if oldfade not in s: raise SystemExit('Large fade anchor missing')
          s=s.replace(oldfade,newfade,1)
          p.write_text(s)

          for fp in ['tests/combat-hub-current-data-audit.mjs','tests/combat-hub-large-regression.mjs']:
            t=Path(fp)
            q=t.read_text()
            q=q.replace("7\\.9\\.1-github", "7\\.9\\.2-github")
            t.write_text(q)

          t=Path('tests/combat-hub-large-regression.mjs')
          q=t.read_text()
          q=q.replace("assert.match(src, /'FIGHT CARD'/, 'Large fight-card section missing');", "assert.match(src, /'対戦カード'/, 'Large Japanese fight-card section missing');")
          q=q.replace("assert.match(src, /for\\(let i=0;i<34;i\\+\\+\\)/, 'Large smooth hero fade missing');", "assert.match(src, /for\\(let i=0;i<96;i\\+\\+\\)/, 'Large smooth hero fade missing');")
          extra="\nassert.match(src, /function jpCardLabel\\(label\\)/, 'Japanese card-label mapper missing');\nassert.match(src, /'メインイベント'/, 'Japanese main-event label missing');\nassert.match(src, /'次大会'/, 'Japanese next-event label missing');\nassert.match(src, /'前座カード発表待ち'/, 'Japanese undercard fallback missing');\n"
          if 'Japanese card-label mapper missing' not in q: q += extra
          t.write_text(q)

          r=Path('tests/combat-hub-regression.mjs')
          q=r.read_text()
          q=q.replace("'MAIN EVENT',6\\.1,new Color\\(S\\.accent\\),'bold'", "'メインイベント',6\\.1,new Color\\(S\\.accent\\),'bold'")
          q=q.replace("MAIN EVENT emphasis label missing", "Japanese main-event emphasis label missing")
          r.write_text(q)
          PY
      - name: Run syntax and regression suite
        run: |
          node --check combat-hub.js
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit localized UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-current-data-audit.mjs tests/combat-hub-large-regression.mjs tests/combat-hub-regression.mjs
          git commit -m 'feat: localize combat hub UI to Japanese' || exit 0
          git push origin HEAD:chatgpt/ja-ui-v7.9.2
