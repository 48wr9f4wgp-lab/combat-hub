name: BOXING Large Poster Source Fix

on:
  push:
    branches: [chatgpt/boxing-large-poster-v7.11.7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-large-poster-v7.11.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fix BOXING Large poster source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('combat-hub.js')
          s = p.read_text()
          old = "if(KEY==='boxing'&&config.widgetFamily==='large')return{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:null,lightweight:true};"
          new = "if(KEY==='boxing'&&config.widgetFamily==='large')return{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:await eventPoster(D),lightweight:true};"
          if old not in s:
              raise SystemExit('expected BOXING Large heroContext guard not found')
          s = s.replace(old, new, 1)
          s = s.replace('// v7.11.6-github — Boxing Large lightweight poster background', '// v7.11.7-github — Boxing Large poster source fix', 1)
          s = s.replace("const VERSION='7.11.6-github';", "const VERSION='7.11.7-github';", 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          node --check combat-hub.js
          grep -F "poster:await eventPoster(D),lightweight:true" combat-hub.js
          grep -F "const VERSION='7.11.7-github';" combat-hub.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js
          git commit -m "fix: load poster for BOXING Large lightweight path"
          git push origin HEAD:chatgpt/boxing-large-poster-v7.11.7
