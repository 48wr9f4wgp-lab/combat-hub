name: Inspect Ring Events
on:
  push:
    branches: [chatgpt/boxing-ring-parser-inspect3]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect Ring news markup
        shell: bash
        run: |
          node <<'NODE'
          const url='https://www.ringmagazine.com/news/news';
          const res=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'text/html'}});
          const html=await res.text();
          console.log('status',res.status,'bytes',html.length,'nextflight',html.includes('__next_f.push'));
          const out=[];
          for(const m of html.matchAll(/<a\b[^>]*href=["']([^"']*\/news\/[^"'#?]+)["'][^>]*>([\s\S]*?)<\/a>/gi)){
            const href=m[1],text=m[2].replace(/<[^>]+>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim();
            if(!text||text.length<10) continue;
            const key=href+'|'+text;
            if(!out.some(x=>x.key===key))out.push({key,href,text});
          }
          console.log('article anchors',out.length);
          for(const x of out.filter(x=>/(Sep(?:t\.?|tember)?\s+\d{1,2}|Oct(?:ober)?\s+\d{1,2}|fight|return|clash|bout|title)/i.test(x.text)).slice(0,80)) console.log('CAND',x.href,'::',x.text.slice(0,220));
          NODE
