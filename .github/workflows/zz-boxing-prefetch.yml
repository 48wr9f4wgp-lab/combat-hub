name: Temporary BOXING prefetch patch
on:
  push:
    branches: [chatgpt/boxing-prefetch]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-prefetch
      - name: Apply verified prefetch architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text()
          s=s.replace('// v7.12.7-github — remove temporary sync UI; retain BOXING runtime audit + memory guard','// v7.12.8-github — BOXING manual verified prefetch; widget cache-only next-event path')
          s=s.replace("const VERSION='7.12.7-github';","const VERSION='7.12.8-github';")

          start=s.index('async function loadData(){')
          end=s.index('\n\nfunction trustedLargeNext',start)
          new_load=r'''function boxingPrefetchValid(snap,e,now=Date.now()){if(KEY!=='boxing'||!e||!rollforwardEligible(snap,e,now))return false;const source=eventSourceKey(e);return /^ringmagazine\.com(?:\/|$)/.test(source);}
          function boxingVerifiedCache(cached,snap,now){if(KEY!=='boxing'||!cached?.data||cached?.verifiedBy!=='strictNextEvent'||!Number.isFinite(Number(cached?.verifiedAt)))return null;const data=normalizeOneCompositeEvent(cached.data);return boxingPrefetchValid(snap,data,now)?data:null;}
          async function loadData(){
            const snap=normalizeOneCompositeEvent({...SNAPSHOT[KEY]});
            if(currentLocked(snap)){const current=await refreshLockedCurrent(snap);if(!current.posterURL)current.posterURL=await cachedMetaImageURL(current.source,`${KEY}-event`,4*3600000);current.lockedCurrent=true;return current;}
            const path=cacheFile(`combat-hub-next-${KEY}.json`),cached=readJSON(path),now=Date.now(),cachedData=cached?.data?normalizeOneCompositeEvent(cached.data):null,verifiedBoxing=boxingVerifiedCache(cached,snap,now);
            if(KEY==='boxing'&&config.runsInWidget){
              if(verifiedBoxing)return{...verifiedBoxing,prefetched:true,cacheVerified:true};
              return{...snap,startAt:new Date(now+24*3600000).toISOString(),location:'会場未定',name:'次大会',main:{a:'次大会',b:'確認中',context:S.label},support:[],cardTba:true,posterURL:null,source:S.listing,timeTba:true,displayDate:'日程未定',nextPending:true,lightweightPending:true,cacheVerified:false};
            }
            if(KEY==='boxing'&&!config.runsInWidget){
              const live=await strictNextEvent(snap);
              if(live&&boxingPrefetchValid(snap,live,now)){writeJSON(path,{savedAt:now,verifiedAt:now,verifiedBy:'strictNextEvent',data:live});return{...live,prefetched:true,cacheVerified:true};}
              if(verifiedBoxing)return{...verifiedBoxing,stale:true,prefetched:true,cacheVerified:true};
              const trusted=trustedRollforward(snap);if(trusted)return trusted;
              return{...snap,cardTba:true,main:{a:'次大会',b:'確認中',context:S.label},support:[],nextPending:true,cacheVerified:false};
            }
            if(cachedData&&now-Number(cached.savedAt)<4*3600000&&rollforwardEligible(snap,cachedData,now))return cachedData;
            const live=await strictNextEvent(snap);if(live&&rollforwardEligible(snap,live,now)){writeJSON(path,{savedAt:now,data:live});return live;}
            const trusted=trustedRollforward(snap);if(trusted){writeJSON(path,{savedAt:now,data:trusted});return trusted;}
            if(cachedData&&rollforwardEligible(snap,cachedData,now))return{...cachedData,stale:true};
            return{...snap,cardTba:true,main:{a:'次大会',b:'確認中',context:S.label},support:[],nextPending:true};
          }'''
          s=s[:start]+new_load+s[end:]

          astart=s.index('function writeRuntimeAudit(D,ctx){')
          aend=s.index('\n\nfunction imageRect',astart)
          new_audit="function writeRuntimeAudit(D,ctx){try{writeJSON(cacheFile('combat-hub-runtime-audit.json'),{savedAt:Date.now(),version:VERSION,loaderVersion:typeof LOADER_VERSION!=='undefined'?LOADER_VERSION:null,key:KEY,widgetFamily:config.widgetFamily||null,nextPending:!!D.nextPending,lightweightPending:!!D.lightweightPending,cardTba:!!D.cardTba,lockedCurrent:!!D.lockedCurrent,prefetched:!!D.prefetched,cacheVerified:!!D.cacheVerified,name:D.name||null,source:D.source||null,posterLoaded:!!ctx?.poster});}catch(_){}}"
          s=s[:astart]+new_audit+s[aend:]
          p.write_text(s)

          p=Path('tests/combat-hub-large-regression.mjs')
          t=p.read_text()
          old="assert.match(src, /if\\(KEY==='boxing'&&config\\.runsInWidget\\)\\{if\\(cachedData&&rollforwardEligible\\(snap,cachedData,now\\)\\)return cachedData;return\\{/, 'BOXING Medium/Large must short-circuit before live deep discovery');"
          new="assert.match(src, /function boxingPrefetchValid\\(snap,e,now=Date\\.now\\(\\)\\)/, 'BOXING verified prefetch validator missing');\nassert.match(src, /function boxingVerifiedCache\\(cached,snap,now\\)/, 'BOXING verified cache reader missing');\nassert.match(src, /if\\(KEY==='boxing'&&config\\.runsInWidget\\)\\{[\\s\\S]*if\\(verifiedBoxing\\)return\\{\\.\\.\\.verifiedBoxing,prefetched:true,cacheVerified:true\\}/, 'BOXING widgets must read verified cache only');\nassert.match(src, /verifiedBy:'strictNextEvent'/, 'BOXING manual prefetch verification marker missing');"
          if old not in t: raise SystemExit('large regression target not found')
          t=t.replace(old,new)
          p.write_text(t)

          p=Path('tests/combat-hub-cache-regression.mjs')
          t=p.read_text()
          t=t.replace("async function boot(parameter, { now, textResponses = {}, imageResponses = {} } = {}) {","async function boot(parameter, { now, textResponses = {}, imageResponses = {}, runsInWidget = true } = {}) {")
          t=t.replace("config: { runsInWidget: true },","config: { runsInWidget },")
          marker="\nconsole.log('COMBAT HUB v7.8 cache performance checks: OK');"
          if marker not in t: raise SystemExit('cache regression marker not found')
          extra=r'''

          // BOXING widget mode must ignore legacy/unverified next-event cache and perform zero discovery network work.
          {
            const now=Date.parse('2026-09-14T16:00:00+09:00');
            const future={name:'Alpha vs Beta Championship',startAt:'2026-09-20T10:00:00+09:00',location:'Las Vegas',source:'https://www.ringmagazine.com/events/alpha-vs-beta',main:{a:'Alpha',b:'Beta',context:'TITLE FIGHT'},support:[],cardTba:false,posterURL:null};
            const {api,fm,requests}=await boot('BOXING',{now});
            const path='/docs/combat-hub-next-boxing.json';
            fm.api.writeString(path,JSON.stringify({savedAt:now-60_000,data:future}));
            const pending=await api.loadData();
            assert.equal(pending.nextPending,true,'Unverified BOXING cache must not reach widget output');
            assert.equal(pending.cacheVerified,false);
            assert.equal(stringRequests(requests).length,0,'BOXING widget must not deep-discover when cache is unverified');
            fm.api.writeString(path,JSON.stringify({savedAt:now-60_000,verifiedAt:now-60_000,verifiedBy:'strictNextEvent',data:future}));
            const verified=await api.loadData();
            assert.equal(verified.name,future.name);
            assert.equal(verified.cacheVerified,true);
            assert.equal(verified.prefetched,true);
            assert.equal(stringRequests(requests).length,0,'BOXING widget verified-cache path must remain network-free');
          }

          // Manual BOXING execution should discover from Ring, validate, and persist a verified next-event cache.
          {
            const now=Date.parse('2026-09-14T16:00:00+09:00');
            const listing='https://www.ringmagazine.com/events';
            const event='https://www.ringmagazine.com/events/alpha-vs-beta';
            const listingHtml=`<script type="application/ld+json">${JSON.stringify({'@type':'Event',name:'Alpha vs Beta Championship',startDate:'2026-09-20T10:00:00+09:00',location:{name:'Las Vegas'},url:event})}</script>`;
            const detailHtml='<title>Alpha vs Beta</title><meta property="og:image" content="https://img.example/alpha-beta.jpg">';
            const {api,fm}=await boot('BOXING',{now,runsInWidget:false,textResponses:{[listing]:listingHtml,[event]:detailHtml}});
            const data=await api.loadData();
            assert.equal(data.cacheVerified,true,'Manual BOXING run should return verified prefetched data');
            assert.equal(data.prefetched,true);
            const saved=JSON.parse(fm.api.readString('/docs/combat-hub-next-boxing.json'));
            assert.equal(saved.verifiedBy,'strictNextEvent');
            assert.equal(saved.verifiedAt,now);
            assert.equal(saved.data.source,event);
          }
          '''
          t=t.replace(marker,extra+marker)
          p.write_text(t)
          PY
          node --check combat-hub.js
          node --check tests/combat-hub-large-regression.mjs
          node --check tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-large-regression.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-boxing-prefetch.yml
          git add combat-hub.js tests/combat-hub-large-regression.mjs tests/combat-hub-cache-regression.mjs
          git commit -m 'feat: add verified BOXING manual prefetch cache'
          git push origin HEAD:chatgpt/boxing-prefetch
