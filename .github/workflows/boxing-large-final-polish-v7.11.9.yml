name: BOXING Large Final Polish v7.11.9

on:
  push:
    branches: [chatgpt/boxing-large-final-polish-v7.11.9]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-large-final-polish-v7.11.9
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply BOXING Large final polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text()
          replacements = [
            ("// v7.11.8-github — Boxing Large adaptive information rail", "// v7.11.9-github — Boxing Large final visual polish"),
            ("const VERSION='7.11.8-github';", "const VERSION='7.11.9-github';"),
            ("const status=h.addStack();status.layoutVertically();const sl=status.addStack();sl.addSpacer();tx(sl,statusLabel(D),5.9,new Color(C.muted),'bold');status.addSpacer(2);const badge=status.addStack();badge.backgroundColor=new Color('#05070B',.60);badge.cornerRadius=9;badge.borderWidth=.6;badge.borderColor=new Color(S.accent,.28);badge.setPadding(4,8,4,8);tx(badge,countdown(D),11.1,new Color(C.text),'black');w.addSpacer(D.cardTba?30:40);", "const status=h.addStack();status.layoutVertically();if(KEY!=='boxing'){const sl=status.addStack();sl.addSpacer();tx(sl,statusLabel(D),5.9,new Color(C.muted),'bold');status.addSpacer(2);}const badge=status.addStack();badge.backgroundColor=new Color('#05070B',KEY==='boxing'?.74:.60);badge.cornerRadius=KEY==='boxing'?11:9;badge.borderWidth=.6;badge.borderColor=new Color(S.accent,KEY==='boxing'?.34:.28);badge.setPadding(KEY==='boxing'?5:4,KEY==='boxing'?10:8,KEY==='boxing'?5:4,KEY==='boxing'?10:8);tx(badge,countdown(D),KEY==='boxing'?11.4:11.1,new Color(C.text),'black');w.addSpacer(D.cardTba?30:(KEY==='boxing'?34:40));")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing runtime pattern: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/combat-hub-large-regression.mjs')
          q = t.read_text()
          q = q.replace("const VERSION='7\\.11\\.8-github'", "const VERSION='7\\.11\\.9-github'", 1)
          anchor = "assert.match(src, /'公式情報を確認中',7\\.8/, 'BOXING compact next-status line missing');"
          extra = "\nassert.match(src, /if\\(KEY!==\'boxing\'\\)\\{const sl=status\\.addStack\\(\\)/, 'BOXING Large status label should be suppressed');\nassert.match(src, /badge\\.cornerRadius=KEY===\'boxing\'\\?11:9/, 'BOXING Large premium countdown radius missing');\nassert.match(src, /badge\\.setPadding\\(KEY===\'boxing\'\\?5:4,KEY===\'boxing\'\\?10:8,KEY===\'boxing\'\\?5:4,KEY===\'boxing\'\\?10:8\\)/, 'BOXING Large premium countdown padding missing');\nassert.match(src, /w\\.addSpacer\\(D\\.cardTba\\?30:\\(KEY===\'boxing\'\\?34:40\\)\\)/, 'BOXING Large final hero spacing missing');"
          if anchor not in q:
              raise SystemExit('missing large regression anchor')
          q = q.replace(anchor, anchor + extra, 1)
          q = q.replace("COMBAT HUB Large V5.2 + BOXING adaptive-rail regression: OK", "COMBAT HUB Large V5.2 + BOXING final-polish regression: OK")
          t.write_text(q)
          PY
      - name: Syntax and focused regression
        run: |
          node --check combat-hub.js
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-japanese-display.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git commit -m "polish: finish BOXING Large visual hierarchy"
          git push origin HEAD:chatgpt/boxing-large-final-polish-v7.11.9
