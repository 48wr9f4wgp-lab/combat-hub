name: RC Regression Trusted Cache Fix

on:
  push:
    branches:
      - chatgpt/rc-live-data-hardening-v7.12.0-clean
    paths:
      - .github/workflows/rc-regression-trusted-cache-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/rc-live-data-hardening-v7.12.0-clean
      - name: Update stale-cache priority regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/combat-hub-regression.mjs')
          s=p.read_text()
          replacements={
            "// Stale event cache remains a recovery path when live discovery fails.": "// Trusted official next snapshot must outrank stale cache when live discovery fails.",
            "  assert.equal(data.name, 'UFC Stale Event');": "  assert.equal(data.name, 'Crypto.com UFC 331: Van vs Pantoja 2');",
            "  assert.equal(data.stale, true, 'Stale cache fallback flag missing');": "  assert.equal(data.trustedNext, true, 'Trusted next snapshot should outrank stale cache');",
          }
          for old,new in replacements.items():
              assert old in s, f'legacy line not found: {old}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify regression syntax
        run: node --check tests/combat-hub-regression.mjs
      - name: Commit test update
        run: |
          git config user.name "chatgpt-combat-hub"
          git config user.email "actions@users.noreply.github.com"
          git add tests/combat-hub-regression.mjs
          git commit -m "test: prefer trusted next snapshot over stale cache"
          git push origin HEAD:chatgpt/rc-live-data-hardening-v7.12.0-clean
