name: COMBAT HUB Regression

on:
  push:
    branches:
      - chatgpt/k1-medium-contrast-v7171

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/k1-medium-contrast-v7171
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply K-1 Medium contrast polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text()
          replacements={
            "// v7.17.0-github — Medium unified layout/timing hierarchy across all organizations; Large v7.16.1 geometry preserved":"// v7.17.1-github — K-1 Medium contrast polish; shared Medium geometry and Large v7.16.1 preserved",
            "const VERSION='7.17.0-github';":"const VERSION='7.17.1-github';",
            "k1:{heroShade:.60,posterShade:.46,headerShade:.10,mainShade:.11,footShade:.17,veil:.055,gap:15,mainSize:13.6,division:7.3}":"k1:{heroShade:.66,posterShade:.52,headerShade:.10,mainShade:.11,footShade:.17,veil:.055,gap:15,mainSize:13.6,division:7.3}",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing combat-hub target: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('HANDOFF.md')
          h=p.read_text()
          if 'Runtime: **v7.17.0-github**' not in h:
              raise SystemExit('HANDOFF runtime marker missing')
          h=h.replace('Runtime: **v7.17.0-github**','Runtime: **v7.17.1-github**',1)
          marker='## 6A. Medium UI architecture in v7.17.0'
          note='''## 6B. K-1 Medium contrast polish in v7.17.1\n\n- Physical iPhone review after Medium unification showed K-1 background art competing with text more than the other organizations.\n- K-1 Medium-only shared background rendering now uses stronger hero/poster darkness (`heroShade .66`, `posterShade .52`).\n- Medium geometry, typography, status hierarchy, Large geometry, BOXING cache-only safety, Loader, and friends-stable are unchanged.\n\n'''
          if note.strip() not in h:
              if marker not in h:
                  raise SystemExit('HANDOFF Medium architecture marker missing')
              h=h.replace(marker,note+marker,1)
          p.write_text(h)

          p=Path('tests/combat-hub-typography-regression.mjs')
          t=p.read_text()
          guard="assert.match(src, /k1:\\{heroShade:\\.66,posterShade:\\.52,headerShade:\\.10,mainShade:\\.11,footShade:\\.17,veil:\\.055/, 'K-1 Medium contrast polish regressed');\n"
          anchor="// Medium v7.17.0 uses one geometry and type scale across all organizations.\n"
          if guard not in t:
              if anchor not in t:
                  raise SystemExit('typography anchor missing')
              t=t.replace(anchor,"// K-1 Medium contrast polish must remain visual-only and preserve shared geometry.\n"+guard+"\n"+anchor,1)
          p.write_text(t)

          p=Path('tests/combat-hub-k1-layout-regression.mjs')
          k=p.read_text()
          old="assert.match(src, /k1:\\{heroShade:\\.60,posterShade:\\.46,headerShade:\\.10,mainShade:\\.11,footShade:\\.17,veil:\\.055,gap:15,mainSize:13\\.6,division:7\\.3\\}/, 'K-1 main row must retain the verified v7.7.4 geometry');"
          new="assert.match(src, /k1:\\{heroShade:\\.66,posterShade:\\.52,headerShade:\\.10,mainShade:\\.11,footShade:\\.17,veil:\\.055,gap:15,mainSize:13\\.6,division:7\\.3\\}/, 'K-1 Medium contrast tokens regressed');"
          if old not in k:
              raise SystemExit('K-1 regression shade marker missing')
          k=k.replace(old,new,1)
          p.write_text(k)
          PY
      - name: Full verification
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check combat-hub-preview-loader.js
          node --check combat-hub-large-preview-loader.js
          node --check tests/combat-hub-regression.mjs
          node --check tests/combat-hub-cache-regression.mjs
          node --check tests/combat-hub-one-composite-regression.mjs
          node --check tests/combat-hub-ufc-rollforward-regression.mjs
          node --check tests/combat-hub-k1-layout-regression.mjs
          node --check tests/combat-hub-typography-regression.mjs
          node --check tests/combat-hub-current-data-audit.mjs
          node --check tests/combat-hub-large-regression.mjs
          node --check tests/combat-hub-japanese-display.mjs
          node --check tests/combat-hub-event-transition-regression.mjs
          node tests/combat-hub-regression.mjs
          node tests/combat-hub-cache-regression.mjs
          node tests/combat-hub-one-composite-regression.mjs
          node tests/combat-hub-ufc-rollforward-regression.mjs
          node tests/combat-hub-k1-layout-regression.mjs
          node tests/combat-hub-typography-regression.mjs
          node tests/combat-hub-current-data-audit.mjs
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-japanese-display.mjs
          node tests/combat-hub-event-transition-regression.mjs
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js HANDOFF.md tests/combat-hub-typography-regression.mjs tests/combat-hub-k1-layout-regression.mjs
          git commit -m "style: improve K-1 Medium background contrast"
          git push origin HEAD:chatgpt/k1-medium-contrast-v7171
