name: BOXING Large Poster Repair

on:
  push:
    branches: [chatgpt/boxing-large-poster-v7.11.6]

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore enable boxing poster repair'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply lightweight BOXING poster background
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()
          s=s.replace("// v7.11.5-github — Boxing Large ultra-light rendering", "// v7.11.6-github — Boxing Large lightweight poster background")
          s=s.replace("const VERSION='7.11.5-github';", "const VERSION='7.11.6-github';")
          old="if(BOXING_LARGE){w.backgroundColor=new Color('#020305');renderLarge(w,D,ctx,NEXT,null);}"
          new="if(BOXING_LARGE){if(ctx.poster)w.backgroundImage=ctx.poster;else w.backgroundColor=new Color('#020305');renderLarge(w,D,ctx,NEXT,null);}"
          if old not in s:
            raise SystemExit('BOXING Large ultralight anchor missing')
          s=s.replace(old,new)
          p.write_text(s)

          for tp in Path('tests').glob('*.mjs'):
            t=tp.read_text()
            t=t.replace('7.11.5-github','7.11.6-github').replace('7.11.5','7.11.6')
            t=t.replace(r"7\.11\.5-github",r"7\.11\.6-github")
            tp.write_text(t)

          lp=Path('tests/combat-hub-large-regression.mjs')
          t=lp.read_text()
          old_assert="assert.match(src, /if\\(BOXING_LARGE\\)\\{w\\.backgroundColor=new Color\\('#020305'\\);renderLarge\\(w,D,ctx,NEXT,null\\);\\}/, 'BOXING Large must bypass DrawContext background rendering');"
          new_assert="assert.match(src, /if\\(BOXING_LARGE\\)\\{if\\(ctx\\.poster\\)w\\.backgroundImage=ctx\\.poster;else w\\.backgroundColor=new Color\\('#020305'\\);renderLarge\\(w,D,ctx,NEXT,null\\);\\}/, 'BOXING Large must use direct poster background without DrawContext composition');"
          if old_assert not in t:
            raise SystemExit('Large regression BOXING anchor missing')
          t=t.replace(old_assert,new_assert)
          lp.write_text(t)
          PY
      - name: Verify before commit
        run: |
          node --check combat-hub.js
          for f in tests/*.mjs; do node --check "$f"; done
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit repair
        run: |
          git config user.name '48wr9f4wgp-lab'
          git config user.email '48wr9f4wgp@privaterelay.appleid.com'
          git add combat-hub.js tests
          git commit -m 'fix: restore BOXING Large poster background'
          git push
