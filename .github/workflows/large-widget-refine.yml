name: Large Widget Visual Refinement

on:
  push:
    branches:
      - feature/large-widget-v7.9.0
    paths:
      - .large-widget-refine-trigger

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/large-widget-v7.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply visual refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()

          old="if(!candidates.length)return cached?.data?normalizeOneCompositeEvent(cached.data):null;const ev=candidates[0],data={name:stripHTML(ev.name)||S.label,startAt:ev.startAt,location:shortLoc(ev.location||''),source:ev.source||S.listing,timeTba:false};"
          new="if(!candidates.length){const deep=await strictNextEvent(base);if(deep){const data={name:stripHTML(deep.name)||S.label,startAt:deep.startAt,location:shortLoc(deep.location||''),source:deep.source||S.listing,timeTba:!!deep.timeTba};writeJSON(path,{savedAt:now,data});return data;}return cached?.data?normalizeOneCompositeEvent(cached.data):null;}const ev=candidates[0],data={name:stripHTML(ev.name)||S.label,startAt:ev.startAt,location:shortLoc(ev.location||''),source:ev.source||S.listing,timeTba:false};"
          if old not in s: raise SystemExit('large-next anchor not found')
          s=s.replace(old,new,1)

          old="function largeImageRect(image,x,width,side){const H=420;if(!image?.size)return new Rect(x,0,width,H);const iw=image.size.width,ih=image.size.height,scale=Math.max(width/iw,H/ih),dw=iw*scale,dh=ih*scale,bias=side==='left'?.03:.97;return new Rect(x+(width-dw)*bias,(H-dh)/2-34,dw,dh);}"
          new="function largeImageRect(image,x,width,side){const H=370;if(!image?.size)return new Rect(x,8,width,H);const iw=image.size.width,ih=image.size.height,scale=Math.max(width/iw,H/ih),dw=iw*scale,dh=ih*scale,bias=side==='left'?.04:.96;return new Rect(x+(width-dw)*bias,8+(392-dh)/2-4,dw,dh);}"
          if old not in s: raise SystemExit('large image rect anchor not found')
          s=s.replace(old,new,1)

          s=s.replace("scale=Math.max(720/iw,420/ih)","scale=Math.max(720/iw,392/ih)",1)
          s=s.replace("new Rect((720-dw)/2,(420-dh)/2,dw,dh)","new Rect((720-dw)/2,(392-dh)/2,dw,dh)",1)
          old="if(ctx.a.image)c.drawImageInRect(ctx.a.image,largeImageRect(ctx.a.image,-5,KEY==='k1'?370:360,'left'));if(ctx.b.image)c.drawImageInRect(ctx.b.image,largeImageRect(ctx.b.image,KEY==='k1'?350:365,KEY==='k1'?375:360,'right'));"
          new="if(ctx.a.image)c.drawImageInRect(ctx.a.image,largeImageRect(ctx.a.image,0,350,'left'));if(ctx.b.image)c.drawImageInRect(ctx.b.image,largeImageRect(ctx.b.image,370,350,'right'));"
          if old not in s: raise SystemExit('large split hero anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("c.fillRect(new Rect(0,0,720,420));softBand(c,0,132,Math.min(.28,V.headerShade+.06),28);softBand(c,112,330,Math.min(.30,V.mainShade+.07),30);for(let i=0;i<8;i++){const a=.12+i*.085;c.setFillColor(new Color('#050609',Math.min(.96,a)));c.fillRect(new Rect(0,326+i*12,720,18));}c.setFillColor(new Color('#050609',.96));c.fillRect(new Rect(0,410,720,346));","c.fillRect(new Rect(0,0,720,392));softBand(c,0,126,Math.min(.28,V.headerShade+.06),28);softBand(c,102,306,Math.min(.30,V.mainShade+.07),30);for(let i=0;i<8;i++){const a=.12+i*.085;c.setFillColor(new Color('#050609',Math.min(.96,a)));c.fillRect(new Rect(0,298+i*12,720,18));}c.setFillColor(new Color('#050609',.97));c.fillRect(new Rect(0,382,720,374));",1)

          old="tx(hl,S.label,21.5,new Color(C.text),'black');hl.addSpacer(3);const meta=hl.addStack();"
          new="tx(hl,S.label,21.5,new Color(C.text),'black');hl.addSpacer(1);const eventName=tx(hl,stripHTML(D.name||''),7.2,new Color(S.accent),'bold');eventName.lineLimit=1;eventName.minimumScaleFactor=.70;hl.addSpacer(3);const meta=hl.addStack();"
          if old not in s: raise SystemExit('large header anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("w.addSpacer(D.cardTba?34:30);","w.addSpacer(D.cardTba?28:24);",1)
          s=s.replace("w.addSpacer(20);const panel=w.addStack();panel.layoutVertically();panel.backgroundColor=new Color('#050609',.86);panel.cornerRadius=13;panel.setPadding(10,10,10,10);largeSectionLabel(panel,'FIGHT CARD');panel.addSpacer(5);","w.addSpacer(14);const panel=w.addStack();panel.layoutVertically();panel.backgroundColor=new Color('#050609',.92);panel.cornerRadius=14;panel.setPadding(12,12,12,12);largeSectionLabel(panel,'FEATURED CARD');panel.addSpacer(7);",1)
          old="if(rows.length){rows.forEach((row,i)=>{largeSupportRow(panel,row);if(i<rows.length-1)panel.addSpacer(5);});if(rows.length<4){panel.addSpacer(6);const more=panel.addStack();more.addSpacer();tx(more,'追加カードは公式発表後に自動反映',6.8,new Color(C.muted),'semibold');more.addSpacer();}}else{"
          new="if(rows.length){rows.forEach((row,i)=>{largeSupportRow(panel,row);if(i<rows.length-1)panel.addSpacer(7);});}else{"
          if old not in s: raise SystemExit('large rows anchor not found')
          s=s.replace(old,new,1)

          old="if(next){const name=tx(panel,stripHTML(next.name||'NEXT EVENT'),11.6,new Color(C.text),'bold');name.lineLimit=1;name.minimumScaleFactor=.65;panel.addSpacer(3);tx(panel,largeNextMeta(next),7.6,new Color(C.sub),'semibold');}else{tx(panel,'次大会情報を確認中',10.4,new Color(C.text),'bold');panel.addSpacer(3);tx(panel,'公式一覧に掲載され次第、自動反映',7.2,new Color(C.muted),'semibold');}}"
          new="if(next){const nr=panel.addStack();nr.centerAlignContent();const nl=nr.addStack();nl.layoutVertically();const name=tx(nl,stripHTML(next.name||'NEXT EVENT'),11.8,new Color(C.text),'bold');name.lineLimit=1;name.minimumScaleFactor=.65;nl.addSpacer(3);tx(nl,largeNextMeta(next),7.6,new Color(C.sub),'semibold');nr.addSpacer();const badge=nr.addStack();badge.backgroundColor=new Color(S.accent,.14);badge.cornerRadius=8;badge.setPadding(4,7,4,7);tx(badge,'あと '+countdown(next),7.6,new Color(S.accent),'bold');}else{tx(panel,'公式情報を確認中',10.4,new Color(C.text),'bold');panel.addSpacer(3);tx(panel,'次大会が取得でき次第、自動反映',7.2,new Color(C.muted),'semibold');}w.addSpacer();const foot=w.addStack();foot.addSpacer();tx(foot,'OFFICIAL DATA  ·  AUTO REFRESH',6.4,new Color(C.muted),'semibold');foot.addSpacer();}"
          if old not in s: raise SystemExit('large next block anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          t=Path('tests/combat-hub-large-regression.mjs')
          x=t.read_text()
          x += "\nassert.match(src, /strictNextEvent\\(base\\)/, 'Large next-event deep fallback missing');\nassert.match(src, /'FEATURED CARD'/, 'Large featured-card section missing');\nassert.match(src, /OFFICIAL DATA  ·  AUTO REFRESH/, 'Large footer missing');\n"
          t.write_text(x)
          PY
      - name: Run regression
        run: |
          node --check combat-hub.js
          node --check combat-hub-large-preview-loader.js
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit refined prototype
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git commit -m 'refine: large widget visual pass 2'
          git push origin HEAD:feature/large-widget-v7.9.0
