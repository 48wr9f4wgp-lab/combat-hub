name: Large V4 Luxury Pass

on:
  push:
    branches:
      - chatgpt/large-v4-luxury
    paths:
      - .large-v4-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/large-v4-luxury
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Large V4 luxury pass
        run: python3 .github/scripts/apply-large-v4.py
      - name: Syntax check
        run: node --check combat-hub.js
      - name: Full regression suite
        run: for f in tests/*.mjs; do node "$f"; done
      - name: Commit Large V4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/
          git commit -m 'feat: add Large V4 luxury visual pass'
          git push origin HEAD:chatgpt/large-v4-luxury
