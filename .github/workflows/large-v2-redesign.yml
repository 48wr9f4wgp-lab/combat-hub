name: Large V2 Redesign

on:
  push:
    branches: [main]
    paths: [.large-v2-trigger]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply Large dashboard redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()

          # Portraits: deliberately separated, taller hero field.
          a=s.index('function largePortraitSlot(image,side){')
          b=s.index('function largeBackground(ctx){',a)
          slot="""function largePortraitSlot(image,side){const W=300,H=440,c=new DrawContext();c.size=new Size(W,H);c.opaque=false;c.respectScreenScale=false;if(!image?.size)return c.getImage();const iw=image.size.width,ih=image.size.height,scale=Math.max(W/iw,H/ih),dw=iw*scale,dh=ih*scale,overflow=Math.max(0,dw-W),shift=side==='left'?-overflow*.24:overflow*.24,x=(W-dw)/2+shift,y=(H-dh)/2-8;c.drawImageInRect(image,new Rect(x,y,dw,dh));return c.getImage();}\n"""
          s=s[:a]+slot+s[b:]

          # Background: keep imagery alive much deeper into the Large canvas, then fade to dashboard black.
          a=s.index('function largeBackground(ctx){')
          b=s.index('function renderLargeMainName',a)
          bg="""function largeBackground(ctx){const c=new DrawContext();c.size=new Size(720,756);c.opaque=true;c.respectScreenScale=false;c.setFillColor(new Color('#050609'));c.fillRect(new Rect(0,0,720,756));if(ctx.poster?.size){const iw=ctx.poster.size.width,ih=ctx.poster.size.height,scale=Math.max(720/iw,500/ih),dw=iw*scale,dh=ih*scale;c.drawImageInRect(ctx.poster,new Rect((720-dw)/2,(500-dh)/2,dw,dh));}else{if(ctx.a.image)c.drawImageInRect(largePortraitSlot(ctx.a.image,'left'),new Rect(18,0,300,440));if(ctx.b.image)c.drawImageInRect(largePortraitSlot(ctx.b.image,'right'),new Rect(402,0,300,440));}c.setFillColor(new Color('#000000',Math.max(.42,V.heroShade-.14)));c.fillRect(new Rect(0,0,720,500));softBand(c,0,116,Math.min(.26,V.headerShade+.05),26);softBand(c,128,330,Math.min(.28,V.mainShade+.06),30);for(let i=0;i<14;i++){const a=.08+i*.065;c.setFillColor(new Color('#050609',Math.min(.98,a)));c.fillRect(new Rect(0,330+i*14,720,22));}c.setFillColor(new Color('#050609',.985));c.fillRect(new Rect(0,520,720,236));return c.getImage();}\n"""
          s=s[:a]+bg+s[b:]

          # Replace the old vertically stacked Large panel with a genuine two-column dashboard.
          a=s.index('function renderLarge(w,D,ctx,next){')
          b=s.index('\n\n\nconst D=',a)
          render="""function largeFightRow(box,row){const r=box.addStack();r.centerAlignContent();const lab=r.addStack();lab.size=new Size(42,0);const lt=tx(lab,row.label,6.0,new Color(S.accent),'bold');lt.minimumScaleFactor=.55;r.addSpacer(2);const aa=r.addStack();aa.size=new Size(61,0);const at=tx(aa,row.a,7.2,new Color(C.text),'semibold');at.minimumScaleFactor=.46;r.addSpacer(2);tx(r,'VS',5.9,new Color(S.accent),'bold');r.addSpacer(2);const bb=r.addStack();bb.size=new Size(61,0);const bt=tx(bb,row.b,7.2,new Color(C.text),'semibold');bt.minimumScaleFactor=.46;bt.rightAlignText();}\nfunction largeDashLabel(box,text){const r=box.addStack();tx(r,text,6.6,new Color(S.accent),'bold');r.addSpacer();}\nfunction renderLarge(w,D,ctx,next){const h=w.addStack();h.centerAlignContent();const hl=h.addStack();hl.layoutVertically();tx(hl,S.label,21.5,new Color(C.text),'black');hl.addSpacer(1);const en=tx(hl,stripHTML(D.name||''),7.3,new Color(S.accent),'bold');en.minimumScaleFactor=.68;hl.addSpacer(3);const meta=hl.addStack();tx(meta,dateText(D),8.4,new Color(C.sub),'semibold');meta.addSpacer(5);tx(meta,'·',7,new Color(C.muted));meta.addSpacer(5);tx(meta,shortLoc(D.location),8.4,new Color(C.sub),'semibold');h.addSpacer();const status=h.addStack();status.layoutVertically();const sl=status.addStack();sl.addSpacer();tx(sl,statusLabel(D),6.2,new Color(C.muted),'bold');status.addSpacer(3);const badge=status.addStack();badge.backgroundColor=new Color(S.accent,.13);badge.cornerRadius=9;badge.setPadding(4,8,4,8);tx(badge,countdown(D),11.5,new Color(C.text),'black');w.addSpacer(D.cardTba?34:44);if(D.cardTba){const center=w.addStack();center.layoutVertically();const title=tx(center,D.nextPending?'次大会情報を確認中':'対戦カード発表待ち',15.0,new Color(C.text),'black');title.centerAlignText();center.addSpacer(6);const sub=tx(center,stripHTML(D.name||D.main.context),8.4,new Color(S.accent),'semibold');sub.centerAlignText();}else{const main=w.addStack();main.centerAlignContent();const aBox=main.addStack();aBox.layoutVertically();aBox.size=new Size(132,46);aBox.addSpacer();renderLargeMainName(aBox,ctx.a.name);aBox.addSpacer();main.addSpacer(6);const center=main.addStack();center.layoutVertically();center.size=new Size(44,46);center.addSpacer();const mt=tx(center,'MAIN EVENT',6.0,new Color(S.accent),'bold');mt.centerAlignText();center.addSpacer(2);const vs=tx(center,'VS',16.2,new Color(S.accent),'black');vs.centerAlignText();center.addSpacer();main.addSpacer(6);const bBox=main.addStack();bBox.layoutVertically();bBox.size=new Size(132,46);bBox.addSpacer();renderLargeMainName(bBox,ctx.b.name);bBox.addSpacer();w.addSpacer(5);const dv=tx(w,division(D.main.context),8.0,new Color('#D4D8DF'),'semibold');dv.centerAlignText();}w.addSpacer();const dash=w.addStack();dash.centerAlignContent();const card=dash.addStack();card.layoutVertically();card.size=new Size(202,132);card.backgroundColor=new Color('#080A0E',.86);card.cornerRadius=15;card.setPadding(10,9,9,9);const cap=card.addStack();const accent=cap.addStack();accent.size=new Size(18,3);accent.backgroundColor=new Color(S.accent);accent.cornerRadius=2;cap.addSpacer();card.addSpacer(6);largeDashLabel(card,'FEATURED CARD');card.addSpacer(6);const rows=(D.support||[]).slice(0,4);if(rows.length){rows.forEach((row,i)=>{largeFightRow(card,row);if(i<rows.length-1)card.addSpacer(5);});}else{card.addSpacer(18);const em=tx(card,'追加カード発表待ち',7.6,new Color(C.muted),'semibold');em.centerAlignText();}dash.addSpacer(8);const nextBox=dash.addStack();nextBox.layoutVertically();nextBox.size=new Size(110,132);nextBox.backgroundColor=new Color('#0B0D12',.88);nextBox.cornerRadius=15;nextBox.setPadding(10,9,9,9);const ncap=nextBox.addStack();tx(ncap,'NEXT',6.6,new Color(S.accent),'bold');ncap.addSpacer();if(next){nextBox.addSpacer(7);const nn=tx(nextBox,stripHTML(next.name||'NEXT EVENT'),10.0,new Color(C.text),'bold',2);nn.minimumScaleFactor=.58;nextBox.addSpacer(6);tx(nextBox,largeNextMeta(next),6.7,new Color(C.sub),'semibold',2);nextBox.addSpacer();const nb=nextBox.addStack();nb.backgroundColor=new Color(S.accent,.13);nb.cornerRadius=8;nb.setPadding(4,6,4,6);const nt=tx(nb,'あと '+countdown(next),7.0,new Color(S.accent),'bold');nt.minimumScaleFactor=.60;}else{nextBox.addSpacer(13);tx(nextBox,'次大会',8.8,new Color(C.text),'bold');nextBox.addSpacer(4);tx(nextBox,'公式情報を\n確認中',7.2,new Color(C.muted),'semibold',2);nextBox.addSpacer();}w.addSpacer(2);}\n"""
          s=s[:a]+render+s[b:]
          p.write_text(s)

          # Align the Large regression with V2 geometry and remove obsolete footer expectations.
          t=Path('tests/combat-hub-large-regression.mjs')
          q=t.read_text()
          q=q.replace("assert.match(src, /'NEXT EVENT'/);\n","")
          q=q.replace("assert.match(src, /OFFICIAL DATA  ·  AUTO REFRESH/, 'Large footer missing');\n","")
          q=q.replace("assert.match(src, /new Rect\\(14,8,314,370\\)/, 'Large left portrait slot missing');","assert.match(src, /new Rect\\(18,0,300,440\\)/, 'Large left portrait slot missing');")
          q=q.replace("assert.match(src, /new Rect\\(392,8,314,370\\)/, 'Large right portrait slot missing');","assert.match(src, /new Rect\\(402,0,300,440\\)/, 'Large right portrait slot missing');")
          q += "\nassert.match(src, /function largeFightRow\\(box,row\\)/, 'Large dashboard fight rows missing');\nassert.match(src, /card\\.size=new Size\\(202,132\\)/, 'Large fight-card pane geometry missing');\nassert.match(src, /nextBox\\.size=new Size\\(110,132\\)/, 'Large next-event pane geometry missing');\nassert.match(src, /badge\\.backgroundColor=new Color\\(S\\.accent,\\.13\\)/, 'Large status pill missing');\n"
          t.write_text(q)
          PY
      - name: Test all runtime regressions
        run: |
          node --check combat-hub.js
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit V2 to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git commit -m 'feat: redesign Large as two-column event dashboard' || exit 0
          git push origin HEAD:main
