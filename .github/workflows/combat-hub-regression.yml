name: COMBAT HUB Regression

on:
  push:
    branches: [chatgpt/boxing-large-ultralight-v7.11.5]

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore enable boxing ultralight repair'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply BOXING Large ultra-light path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('combat-hub.js')
          s=p.read_text()
          s=s.replace("// v7.11.4-github — Boxing Large reliability fix", "// v7.11.5-github — Boxing Large ultra-light rendering")
          s=s.replace("const VERSION='7.11.4-github';", "const VERSION='7.11.5-github';")
          old="const D=await loadData(),ctx=await heroContext(D),w=new ListWidget();const IS_LARGE=config.widgetFamily==='large';const NEXT=IS_LARGE?await loadLargeNext(D):null;const NEXT_POSTER=IS_LARGE&&NEXT?await eventPoster(NEXT):null;"
          new="const D=await loadData(),ctx=await heroContext(D),w=new ListWidget();const IS_LARGE=config.widgetFamily==='large';const BOXING_LARGE=IS_LARGE&&KEY==='boxing';const NEXT=BOXING_LARGE?null:(IS_LARGE?await loadLargeNext(D):null);const NEXT_POSTER=IS_LARGE&&NEXT&&!BOXING_LARGE?await eventPoster(NEXT):null;"
          if old not in s: raise SystemExit('runtime pre-render anchor missing')
          s=s.replace(old,new)
          old2="if(IS_LARGE){w.setPadding(14,16,12,16);try{w.backgroundImage=largeBackground(ctx);renderLarge(w,D,ctx,NEXT,NEXT_POSTER);}catch(_){w.backgroundColor=new Color('#020305');renderLarge(w,D,{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:null},NEXT,null);}}else{"
          new2="if(IS_LARGE){w.setPadding(14,16,12,16);if(BOXING_LARGE){w.backgroundColor=new Color('#020305');renderLarge(w,D,ctx,NEXT,null);}else{try{w.backgroundImage=largeBackground(ctx);renderLarge(w,D,ctx,NEXT,NEXT_POSTER);}catch(_){w.backgroundColor=new Color('#020305');renderLarge(w,D,{a:{name:D.main.a,image:null},b:{name:D.main.b,image:null},poster:null},NEXT,null);}}}else{"
          if old2 not in s: raise SystemExit('runtime Large anchor missing')
          s=s.replace(old2,new2)
          p.write_text(s)

          for tp in Path('tests').glob('*.mjs'):
            t=tp.read_text()
            t=t.replace('7.11.4-github','7.11.5-github').replace('7.11.4','7.11.5')
            t=t.replace(r"7\.11\.4-github",r"7\.11\.5-github")
            tp.write_text(t)

          lp=Path('tests/combat-hub-large-regression.mjs')
          t=lp.read_text()
          t=t.replace("assert.match(src, /NEXT_POSTER=IS_LARGE&&NEXT\\?await eventPoster\\(NEXT\\):null/, 'Large next poster loader missing');", "assert.match(src, /const BOXING_LARGE=IS_LARGE&&KEY==='boxing'/, 'BOXING Large ultra-light gate missing');\nassert.match(src, /const NEXT=BOXING_LARGE\\?null:\\(IS_LARGE\\?await loadLargeNext\\(D\\):null\\)/, 'BOXING Large must skip next-event scraping');\nassert.match(src, /NEXT_POSTER=IS_LARGE&&NEXT&&!BOXING_LARGE\\?await eventPoster\\(NEXT\\):null/, 'BOXING Large must skip next-event poster loading');")
          t=t.replace("assert.match(src, /try\\{w\\.backgroundImage=largeBackground\\(ctx\\);renderLarge\\(w,D,ctx,NEXT,NEXT_POSTER\\);\\}catch\\(_\\)/, 'Large render fallback missing');", "assert.match(src, /if\\(BOXING_LARGE\\)\\{w\\.backgroundColor=new Color\\('#020305'\\);renderLarge\\(w,D,ctx,NEXT,null\\);\\}/, 'BOXING Large must bypass DrawContext background rendering');\nassert.match(src, /try\\{w\\.backgroundImage=largeBackground\\(ctx\\);renderLarge\\(w,D,ctx,NEXT,NEXT_POSTER\\);\\}catch\\(_\\)/, 'Non-BOXING Large render fallback missing');")
          lp.write_text(t)
          PY
      - name: Verify before commit
        run: |
          node --check combat-hub.js
          for f in tests/*.mjs; do node --check "$f"; done
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit repair
        run: |
          git config user.name '48wr9f4wgp-lab'
          git config user.email '48wr9f4wgp@privaterelay.appleid.com'
          git add combat-hub.js tests
          git commit -m 'fix: make BOXING Large ultra-light'
          git push
