name: RC Regression Compat Fix

on:
  push:
    branches:
      - chatgpt/rc-live-data-hardening-v7.12.0-clean
    paths:
      - .github/workflows/rc-regression-compat-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/rc-live-data-hardening-v7.12.0-clean
      - name: Update legacy horizon assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/combat-hub-regression.mjs')
          s=p.read_text()
          old="has(/Date\\.now\\(\\)\\+180\\*86400000/, 'next-event search horizon changed unexpectedly');"
          new="has(/(?:Date\\.now\\(\\)|now)\\+180\\*86400000/, 'next-event search horizon changed unexpectedly');"
          assert old in s, 'legacy horizon assertion not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify regression syntax
        run: node --check tests/combat-hub-regression.mjs
      - name: Commit test update
        run: |
          git config user.name "chatgpt-combat-hub"
          git config user.email "actions@users.noreply.github.com"
          git add tests/combat-hub-regression.mjs
          git commit -m "test: accept explicit RC horizon clock"
          git push origin HEAD:chatgpt/rc-live-data-hardening-v7.12.0-clean
