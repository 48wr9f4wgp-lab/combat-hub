name: Device QA Hotfix

on:
  push:
    branches:
      - hotfix/device-qa-v7.8.2
    paths:
      - .github/workflows/device-qa-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/device-qa-v7.8.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply device QA hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text()
          replacements = {
            "// v7.8.1-github — 2026-09-11 audited live baseline + safe current refresh": "// v7.8.2-github — device QA hotfix: UFC hero + post-event status",
            "const VERSION='7.8.1-github';": "const VERSION='7.8.2-github';",
            "const KNOWN_UFC={NURMAGOMEDOV:'https://www.ufc.com/athlete/umar-nurmagomedov',SONG:'https://www.ufc.com/athlete/song-yadong',HOOKER:'https://www.ufc.com/athlete/dan-hooker',PARNASSE:'https://www.ufc.com/athlete/salahdine-parnasse'};": "const KNOWN_UFC={NURMAGOMEDOV:'https://www.ufc.com/athlete/umar-nurmagomedov',SONG:'https://www.ufc.com/athlete/song-yadong',HOOKER:'https://www.ufc.com/athlete/dan-hooker',PARNASSE:'https://www.ufc.com/athlete/salahdine-parnasse',JEANSILVA:'https://www.ufc.com/athlete/jean-silva',JOSEMIGUELDELGADO:'https://www.ufc.com/athlete/jose-miguel-delgado'};",
            "function countdown(D){if(D.timeTba)return'時刻未定';const q=new Date(D.startAt)-Date.now();if(q<=0)return D.nextPending?'確認中':'開催中';const m=Math.floor(q/60000),days=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;if(days>0)return`${days}日 ${h}時間`;if(h>0)return`${h}時間 ${mm}分`;return`${mm}分`;}": "function countdown(D){if(D.timeTba)return'時刻未定';const q=new Date(D.startAt)-Date.now();if(q<=0){if(D.nextPending)return'確認中';const elapsed=-q;return elapsed>=6*3600000?'終了':'開催中';}const m=Math.floor(q/60000),days=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;if(days>0)return`${days}日 ${h}時間`;if(h>0)return`${h}時間 ${mm}分`;return`${mm}分`;}": None,
            "function dateText(D){if(D.timeTba)return`${D.displayDate||dateOnly(D.startAt)} ・ 時刻未定`;const f=new DateFormatter();f.locale='ja_JP';f.timeZone='Asia/Tokyo';f.dateFormat=\"M/d (E) HH:mm 'JST'\";return f.string(new Date(D.startAt));}": "function dateText(D){if(D.timeTba)return`${D.displayDate||dateOnly(D.startAt)} ・ 時刻未定`;const f=new DateFormatter();f.locale='ja_JP';f.timeZone='Asia/Tokyo';f.dateFormat=\"M/d (E) HH:mm 'JST'\";return f.string(new Date(D.startAt));}\nfunction statusLabel(D){if(D.timeTba)return'開催';const q=new Date(D.startAt)-Date.now();return q>0?'開催まで':'ステータス';}",
            "tx(lab,D.timeTba?'開催':'開催まで',6.2,new Color(C.muted),'bold');": "tx(lab,statusLabel(D),6.2,new Color(C.muted),'bold');",
          }
          # countdown replacement handled separately to keep mapping readable
          old_count = "function countdown(D){if(D.timeTba)return'時刻未定';const q=new Date(D.startAt)-Date.now();if(q<=0)return D.nextPending?'確認中':'開催中';const m=Math.floor(q/60000),days=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;if(days>0)return`${days}日 ${h}時間`;if(h>0)return`${h}時間 ${mm}分`;return`${mm}分`; }"
          # source has no space before closing brace
          old_count = old_count.replace("; }", ";}")
          new_count = "function countdown(D){if(D.timeTba)return'時刻未定';const q=new Date(D.startAt)-Date.now();if(q<=0){if(D.nextPending)return'確認中';const elapsed=-q;return elapsed>=6*3600000?'終了':'開催中';}const m=Math.floor(q/60000),days=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;if(days>0)return`${days}日 ${h}時間`;if(h>0)return`${h}時間 ${mm}分`;return`${mm}分`; }".replace("; }", ";}")

          for old, new in list(replacements.items()):
              if new is None:
                  continue
              if old not in s:
                  raise SystemExit(f'missing runtime anchor: {old[:80]}')
              s = s.replace(old, new, 1)
          if old_count not in s:
              raise SystemExit('missing countdown anchor')
          s = s.replace(old_count, new_count, 1)
          p.write_text(s)

          p = Path('tests/combat-hub-current-data-audit.mjs')
          t = p.read_text()
          t = t.replace("assert.match(src,/const VERSION='7\\.8\\.1-github'/);", "assert.match(src,/const VERSION='7\\.8\\.2-github'/);")
          marker = "assert.match(src,/sameFight\\(pairs\\[0\\]\\.a,pairs\\[0\\]\\.b,snap\\.main\\.a,snap\\.main\\.b\\)/);"
          addition = marker + "\nassert.match(src,/JEANSILVA:'https:\\/\\/www\\.ufc\\.com\\/athlete\\/jean-silva'/);\nassert.match(src,/JOSEMIGUELDELGADO:'https:\\/\\/www\\.ufc\\.com\\/athlete\\/jose-miguel-delgado'/);\nassert.match(src,/elapsed>=6\\*3600000\\?'終了':'開催中'/);\nassert.match(src,/function statusLabel\\(D\\)/);"
          if marker not in t:
              raise SystemExit('missing audit test anchor')
          t = t.replace(marker, addition, 1)
          p.write_text(t)

          p = Path('HANDOFF_CODEX.md')
          h = p.read_text()
          h = h.replace('Updated: 2026-09-11 JST', 'Updated: 2026-09-12 JST')
          h = h.replace('Audited runtime line: `7.8.1-github`', 'Audited runtime line: `7.8.2-github`')
          anchor = '## 2026-09-11 live-data audit'
          section = "## 2026-09-12 device QA hotfix\nPhysical iPhone screenshots exposed two production-quality defects after v7.8.1 promotion:\n1. Noche UFC rendered the gradient fallback because the current main-event fighters were not in `KNOWN_UFC`; v7.8.2 adds official UFC profile routes for Jean Silva and Jose Miguel Delgado so split fighter hero imagery can resolve.\n2. The 12h data safety lock incorrectly doubled as the visible `開催中` window; v7.8.2 keeps the 12h roll-forward lock but changes the UI to `終了` after 6h and uses a status label after start.\n3. K-1 / BOXING / RIZIN screenshots passed device layout QA; ONE card refresh also proved the confidence-gated live card overlay works.\n\n"
          if anchor not in h:
              raise SystemExit('missing handoff anchor')
          h = h.replace(anchor, section + anchor, 1)
          p.write_text(h)
          PY
      - name: Run full regression suite
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          for f in tests/*.mjs; do node --check "$f"; done
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-current-data-audit.mjs HANDOFF_CODEX.md
          git commit -m "fix: address device QA defects v7.8.2"
          git push origin HEAD:hotfix/device-qa-v7.8.2
