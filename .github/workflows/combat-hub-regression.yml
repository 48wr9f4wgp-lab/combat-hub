name: COMBAT HUB Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply full Japanese display layer
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794' && !contains(github.event.head_commit.message, 'localize event and fighter display names')
        run: python3 .github/scripts/apply-full-ja-v794.py
      - name: Runtime syntax check
        run: node --check combat-hub.js
      - name: Full regression suite
        run: for f in tests/*.mjs; do node "$f"; done
      - name: Commit full Japanese display
        if: github.ref == 'refs/heads/chatgpt/full-ja-v794' && !contains(github.event.head_commit.message, 'localize event and fighter display names')
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js tests/
          git commit -m 'feat: localize event and fighter display names to Japanese'
          git push origin HEAD:chatgpt/full-ja-v794
