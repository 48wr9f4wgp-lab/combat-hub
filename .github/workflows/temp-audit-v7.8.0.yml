name: TEMP COMBAT HUB audit v7.8.0

on:
  push:
    branches:
      - audit/live-data-v7.8.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/live-data-v7.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Apply audited corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('combat-hub.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'combat-hub pattern count {n} != {count}: {old[:120]}')
              s=s.replace(old,new,count)

          rep('// v7.7.7-github — RIZIN full-name + BOXING center contrast / data engine unchanged',
              '// v7.8.0-github — audited current-event truth + safe current refresh')
          rep("const VERSION='7.7.7-github';","const VERSION='7.8.0-github';")

          rep("  one:{startAt:'2026-08-28T20:30:00+09:00',location:'バンコク',name:'ONE Friday Fights 168',cardTba:true,main:{a:'対戦カード',b:'発表待ち',context:'ONE Friday Fights 168'},support:[],source:'https://www.onefc.com/events/one-friday-fights-168/'},",
              "  one:{startAt:'2026-09-04T22:30:00+09:00',location:'バンコク',name:'ONE Friday Fights 169',main:{a:'Petmuangsri Torfunfarm',b:'Gregor Thom',context:'フライ級ムエタイ'},support:[{label:'CO-MAIN',a:'Khunponnoi Sor Sommai',b:'Sunvo Torfunfarm'},{label:'FEATURED',a:'Dansiam Weerasakreck',b:'Hicham Rahmoun'}],source:'https://www.onefc.com/events/one-friday-fights-169/'},")

          rep("  k1:{startAt:'2026-09-12T12:00:00+09:00',location:'東京・代々木第二',name:'K-1 WORLD MAX 2026',main:{a:'金子晃大',b:'璃明武',context:'スーパー・バンタム級タイトル戦'},support:[{label:'TITLE FIGHT',a:'朝久泰央',b:'アラッサン・カマラ'},{label:'TITLE FIGHT',a:'里見柚己',b:'永澤サムエル聖光'}],source:'https://www.k-1.co.jp/k-1wgp/schedule/16669'}",
              "  k1:{startAt:'2026-09-12T12:00:00+09:00',location:'東京・代々木第二',name:'K-1 WORLD MAX 2026',main:{a:'ジョナス・サルシチャ',b:'ゾーラ・アカピャン',context:'-70kg世界最強決定トーナメント開幕戦'},support:[{label:'TITLE FIGHT',a:'金子晃大',b:'璃明武'},{label:'TITLE FIGHT',a:'朝久泰央',b:'アラッサン・カマラ'}],source:'https://www.k-1.co.jp/k-1wgp/schedule/16669'}")

          rep("const KNOWN_K1={'金子晃大':'https://www.k-1.co.jp/fighter/716','璃明武':'https://www.k-1.co.jp/k-1wgp/fighter/856'};",
              "const KNOWN_K1={'金子晃大':'https://www.k-1.co.jp/fighter/716','璃明武':'https://www.k-1.co.jp/k-1wgp/fighter/856','ジョナス・サルシチャ':'https://www.k-1.co.jp/k-1wgp/fighter/1630','ゾーラ・アカピャン':'https://www.k-1.co.jp/k-1wgp/fighter/1451'};")

          marker="function currentLocked(snap){const end=new Date(snap.startAt).getTime()+12*3600000;return Date.now()<end;}\n"
          insert="""function currentLocked(snap){const end=new Date(snap.startAt).getTime()+12*3600000;return Date.now()<end;}\nfunction sameFight(a,b,x,y){const n=v=>String(v||'').toLowerCase().replace(/[\\s・.'’_-]+/g,'');return(n(a)===n(x)&&n(b)===n(y))||(n(a)===n(y)&&n(b)===n(x));}\nfunction currentPagePairs(html){if(!html)return[];if(KEY==='one'){const plain=stripHTML(html),out=[],seen=new Set();for(const m of plain.matchAll(/([A-Za-z][A-Za-z0-9 .’'_-]{2,55})\\s*\\|?\\s*VS\\.?\\s*\\|?\\s*([A-Za-z][A-Za-z0-9 .’'_-]{2,55})/g)){const a=cleanName(m[1]).trim(),b=cleanName(m[2]).trim();if(a.length<2||b.length<2||/Country|Thailand|Scotland|Tickets|Watch|Muay Thai|Kickboxing|MMA/i.test(a+b))continue;const k=a+'|'+b;if(!seen.has(k)){seen.add(k);out.push({a,b});}}if(out.length)return out.slice(0,6);}return fightPairs(html);}\nasync function refreshLockedCurrent(snap){const path=cacheFile(`combat-hub-current-${KEY}.json`),cached=readJSON(path),now=Date.now();if(cached?.data&&now-Number(cached.savedAt)<2*3600000)return{...snap,...cached.data};try{const html=await reqText(snap.source,8),pairs=currentPagePairs(html);let data={posterURL:metaImage(html,snap.source)};if(pairs.length&&sameFight(pairs[0].a,pairs[0].b,snap.main.a,snap.main.b)){const support=KEY==='one'?snap.support:pairs.slice(1,3).map((p,i)=>({label:i?'FEATURED':'CO-MAIN',a:p.a,b:p.b}));data={...data,main:{...snap.main,a:pairs[0].a,b:pairs[0].b},support,cardTba:false};}writeJSON(path,{savedAt:now,data});return{...snap,...data};}catch(_){return snap;}}\n"""
          rep(marker,insert)

          rep("const detailName=html?ufcDetailName(html):'',detailLoc=html?ufcDetailLocation(html):'',pairs=html?fightPairs(html):[];",
              "const detailName=html?ufcDetailName(html):'',detailLoc=html?ufcDetailLocation(html):'',pairs=html?currentPagePairs(html):[];")
          rep("const support=pairs.slice(1,3).map((p,i)=>({label:i?'FEATURED':'CO-MAIN',a:p.a,b:p.b}));",
              "const support=(KEY==='one'?pairs.slice(1,2):pairs.slice(1,3)).map((p,i)=>({label:i?'FEATURED':'CO-MAIN',a:p.a,b:p.b}));")

          rep("async function loadData(){const snap=normalizeOneCompositeEvent({...SNAPSHOT[KEY]});if(currentLocked(snap)){snap.posterURL=await cachedMetaImageURL(snap.source,`${KEY}-event`,4*3600000);snap.lockedCurrent=true;return snap;}",
              "async function loadData(){const snap=normalizeOneCompositeEvent({...SNAPSHOT[KEY]});if(currentLocked(snap)){const current=await refreshLockedCurrent(snap);if(!current.posterURL)current.posterURL=await cachedMetaImageURL(current.source,`${KEY}-event`,4*3600000);current.lockedCurrent=true;return current;}")
          p.write_text(s,encoding='utf-8')

          # Primary regression suite.
          rp=Path('tests/combat-hub-regression.mjs'); r=rp.read_text(encoding='utf-8')
          r=r.replace("has(/const VERSION='7\\.7\\.\\d+-github'/, 'Expected v7.7 reliability runtime');","has(/const VERSION='7\\.8\\.\\d+-github'/, 'Expected v7.8 audited runtime');",1)
          r=r.replace('  one: "2026-08-28T20:30:00+09:00",','  one: "2026-09-04T22:30:00+09:00",',1)
          truth="""assert.ok(src.includes("name:'ONE Friday Fights 169'"), 'ONE current event name stale');\nassert.ok(src.includes("main:{a:'Petmuangsri Torfunfarm',b:'Gregor Thom',context:'フライ級ムエタイ'}"), 'ONE current main card stale');\nassert.ok(src.includes("main:{a:'ジョナス・サルシチャ',b:'ゾーラ・アカピャン',context:'-70kg世界最強決定トーナメント開幕戦'}"), 'K-1 current main event stale');\n"""
          loop="""for (const [key, iso] of Object.entries(expected)) {\n  assert.ok(src.includes(`${key}:{startAt:'${iso}'`), `${key} snapshot startAt drifted: ${iso}`);\n}\n"""
          if loop not in r: raise SystemExit('snapshot truth loop not found')
          r=r.replace(loop,loop+truth,1)
          guard="has(/function currentLocked\\(snap\\)\\{const end=new Date\\(snap\\.startAt\\)\\.getTime\\(\\)\\+12\\*3600000;return Date\\.now\\(\\)<end;\\}/, '12h current-event lock guard missing');"
          if guard not in r: raise SystemExit('current lock guard not found')
          r=r.replace(guard,guard+"\nhas(/async function refreshLockedCurrent\\(snap\\)/, 'Safe locked-current refresh missing');\nhas(/combat-hub-current-\\$\\{KEY\\}\\.json/, 'Current-event refresh cache missing');\nhas(/pairs=html\\?currentPagePairs\\(html\\):\\[\\]/, 'ONE-capable detail card parser missing');",1)
          rp.write_text(r,encoding='utf-8')

          # Version guards in focused suites.
          q=Path('tests/combat-hub-one-composite-regression.mjs'); t=q.read_text(encoding='utf-8')
          t=t.replace("assert.match(source, /const VERSION='7\\.7\\.\\d+-github'/, 'runtime version should stay on v7.7 patch line');","assert.match(source, /const VERSION='7\\.8\\.\\d+-github'/, 'runtime version should stay on v7.8 audited line');",1)
          q.write_text(t,encoding='utf-8')
          for fn in ['tests/combat-hub-typography-regression.mjs','tests/combat-hub-k1-layout-regression.mjs']:
              q=Path(fn); t=q.read_text(encoding='utf-8')
              t=t.replace("assert.match(src, /const VERSION='7\\.7\\.7-github'/, 'Expected final visual runtime v7.7.7');","assert.match(src, /const VERSION='7\\.8\\.0-github'/, 'Expected audited runtime v7.8.0');",1)
              q.write_text(t,encoding='utf-8')

          # Cache suite should guard the new current cache/fallback instead of the old direct snapshot call.
          q=Path('tests/combat-hub-cache-regression.mjs'); t=q.read_text(encoding='utf-8')
          old="assert.match(src, /cachedMetaImageURL\\(snap\\.source,`\\$\\{KEY\\}-event`,4\\*3600000\\)/, 'locked-event metadata cache must remain 4h');"
          new="assert.match(src, /cachedMetaImageURL\\(current\\.source,`\\$\\{KEY\\}-event`,4\\*3600000\\)/, 'locked-event metadata fallback cache must remain 4h');\nassert.match(src, /combat-hub-current-\\$\\{KEY\\}\\.json/, 'locked-current data cache missing');\nassert.match(src, /now-Number\\(cached\\.savedAt\\)<2\\*3600000/, 'locked-current refresh TTL must remain 2h');"
          if old not in t: raise SystemExit('cache guard not found')
          t=t.replace(old,new,1); q.write_text(t,encoding='utf-8')

          # Dedicated audit truth suite.
          Path('tests/combat-hub-current-data-audit.mjs').write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst src=fs.readFileSync('combat-hub.js','utf8');\nassert.match(src,/const VERSION='7\\.8\\.0-github'/);\nassert.match(src,/one:\{startAt:'2026-09-04T22:30:00\\+09:00'[^\\n]*name:'ONE Friday Fights 169'[^\\n]*Petmuangsri Torfunfarm[^\\n]*Gregor Thom/);\nassert.doesNotMatch(src,/one:\{startAt:'2026-08-28T20:30:00\\+09:00'/);\nassert.match(src,/k1:\{startAt:'2026-09-12T12:00:00\\+09:00'[^\\n]*ジョナス・サルシチャ[^\\n]*ゾーラ・アカピャン/);\nassert.doesNotMatch(src,/k1:\{startAt:'2026-09-12T12:00:00\\+09:00'[^\\n]*main:\{a:'金子晃大',b:'璃明武'/);\nassert.match(src,/function currentPagePairs\\(html\\)/);\nassert.match(src,/async function refreshLockedCurrent\\(snap\\)/);\nassert.match(src,/sameFight\\(pairs\[0\]\\.a,pairs\[0\]\\.b,snap\\.main\\.a,snap\\.main\\.b\\)/);\nassert.match(src,/KEY==='one'\\?snap\\.support:pairs\\.slice\\(1,3\\)/);\nconsole.log('COMBAT HUB current-data audit regression: OK');\n""",encoding='utf-8')

          # CI must execute the new audit suite.
          q=Path('.github/workflows/combat-hub-regression.yml'); y=q.read_text(encoding='utf-8')
          y=y.replace("      - name: Typography regression syntax check\n        run: node --check tests/combat-hub-typography-regression.mjs\n",
                      "      - name: Typography regression syntax check\n        run: node --check tests/combat-hub-typography-regression.mjs\n      - name: Current-data audit regression syntax check\n        run: node --check tests/combat-hub-current-data-audit.mjs\n",1)
          y=y.replace("      - name: COMBAT HUB typography suite\n        run: node tests/combat-hub-typography-regression.mjs\n",
                      "      - name: COMBAT HUB typography suite\n        run: node tests/combat-hub-typography-regression.mjs\n      - name: COMBAT HUB current-data audit suite\n        run: node tests/combat-hub-current-data-audit.mjs\n",1)
          q.write_text(y,encoding='utf-8')

          # Stale preview channel: keep compatibility, but make it follow audited main instead of an old branch.
          q=Path('combat-hub-preview-loader.js'); v=q.read_text(encoding='utf-8')
          v=v.replace('// COMBAT HUB v7.7 Preview Loader\n// Branch-only physical-device verification channel.\n// Do not use this as the production home-screen Loader.',
                      '// COMBAT HUB Preview Loader — compatibility helper\n// Canonical production setup remains combat-hub-loader.js. This helper follows main to avoid stale branch previews.',1)
          v=v.replace("const LOADER_VERSION='7.7-preview-1';","const LOADER_VERSION='7.8-preview-main';",1)
          v=v.replace('const MIN_RUNTIME=[7,7,0];','const MIN_RUNTIME=[7,8,0];',1)
          v=v.replace("'https://raw.githubusercontent.com/48wr9f4wgp-lab/combat-hub/chatgpt/reliability-v7.7/combat-hub.js',\n  'https://github.com/48wr9f4wgp-lab/combat-hub/raw/refs/heads/chatgpt/reliability-v7.7/combat-hub.js'",
                      "'https://raw.githubusercontent.com/48wr9f4wgp-lab/combat-hub/main/combat-hub.js',\n  'https://github.com/48wr9f4wgp-lab/combat-hub/raw/refs/heads/main/combat-hub.js'",1)
          v=v.replace("const cachePath=fm.joinPath(doc,'combat-hub-runtime-v7.7-preview.js');\nconst metaPath=fm.joinPath(doc,'combat-hub-runtime-v7.7-preview-meta.json');",
                      "const cachePath=fm.joinPath(doc,'combat-hub-runtime-v7.8-preview-main.js');\nconst metaPath=fm.joinPath(doc,'combat-hub-runtime-v7.8-preview-main-meta.json');",1)
          v=v.replace("throw new Error('COMBAT HUB Preview: v7.7本体を取得できませんでした');","throw new Error('COMBAT HUB Preview: main本体を取得できませんでした');",1)
          q.write_text(v,encoding='utf-8')

          # Documentation: update the canonical operational state and Codex handoff.
          Path('HANDOFF_CODEX.md').write_text("""# COMBAT HUB — Codex Handoff Ledger\n\nUpdated: 2026-09-02 JST\n\n## Canonical state\n- Repository: `48wr9f4wgp-lab/combat-hub`\n- Production branch: `main`\n- Canonical Scriptable route: `combat-hub-loader.js` → `main/combat-hub.js`\n- Audited runtime line: `7.8.0-github`\n- Parameters: UFC / RIZIN / ONE / BOXING / K1\n- COMBAT HUB is independent from Tackle Fit.\n- `friends-stable` is an intentionally isolated friend-facing channel and must not be promoted without explicit user approval.\n\n## 2026-09-02 live-data audit\nOfficial-source audit found two production data defects and one systemic freshness weakness:\n1. ONE Friday Fights 169 had a confirmed card but runtime still showed TBA.\n2. K-1 WORLD MAX 2026 incorrectly labeled Kaneko vs Riamu as the overall main event; official fight order names Jonas Salsicha vs Zhora Akopyan as the event main.\n3. Trusted current snapshots were frozen until start+12h and only refreshed poster metadata, so late official card updates could remain stale.\n\nv7.8.0 corrects the trusted ONE/K-1 snapshots, adds a confidence-gated current-event refresh with a 2h cache, and lets ONE detail parsing use full-name `VS` pairs where available. A parsed current card may overlay the trusted snapshot only when its first fight matches the trusted main event; otherwise the snapshot is preserved.\n\n## Data policy\n- Never invent fighters, times, venues, or cards.\n- Trusted current-event snapshots protect against parser mistakes.\n- Official-page refresh may update a locked current card only after main-event identity validation.\n- Unknown next cards remain `対戦カード発表待ち`; unknown exact times remain `時刻未定`.\n- UFC/RIZIN/ONE/BOXING/K-1 source changes require regression + device verification.\n\n## Quality / merge policy\n- `main` is the personal production baseline.\n- Meaningful work goes through a branch and CI before main promotion.\n- GitHub/CI success is not equivalent to iPhone Scriptable verification.\n- Keep the verified visual system frozen unless a real readability/functional issue is demonstrated.\n- Do not modify `friends-stable` without explicit approval.\n\n## Tests\nCI covers the execution regression, cache behavior, ONE composite timing, UFC roll-forward, K-1 layout, typography, and audited current-data truth.\n\n## Codex return procedure\n1. Fetch `main`; do not reset away unrelated local work.\n2. Read this ledger and the current runtime/tests before editing.\n3. Treat current `main` as canonical unless the user explicitly names another branch.\n4. Preserve the current visual freeze and safe-live rules.\n5. Run all tests and perform Scriptable device verification for runtime changes.\n""",encoding='utf-8')

          q=Path('README.md'); rd=q.read_text(encoding='utf-8')
          rd=rd.replace('- `tests/combat-hub-regression.mjs` — regression guards\n- `.github/workflows/combat-hub-regression.yml` — syntax + regression CI',
                        '- `tests/*.mjs` — execution, cache, roll-forward, layout, typography, and current-data audit guards\n- `.github/workflows/combat-hub-regression.yml` — syntax + regression CI',1)
          rd=rd.replace('node --check tests/combat-hub-regression.mjs\nnode tests/combat-hub-regression.mjs',
                        'for f in tests/*.mjs; do node --check "$f"; done\nfor f in tests/*.mjs; do node "$f"; done',1)
          rd=rd.replace('The script reads public event/profile pages for UFC, RIZIN, ONE, Ring Magazine, and K-1 and keeps bounded local caches inside Scriptable.',
                        'The script reads public official/primary event and profile pages for UFC, RIZIN, ONE, Ring Magazine, and K-1. Trusted current snapshots are combined with confidence-gated official-page refreshes and bounded Scriptable caches; uncertain cards/times remain explicitly TBA.',1)
          rd=rd.replace('The final migration gate is physical-device verification after switching the iPhone Scriptable script to the canonical Loader above.',
                        '`main` is the personal production baseline. Runtime changes still require physical-device verification after CI. `friends-stable` is a separate distribution channel and is not promoted implicitly.',1)
          q.write_text(rd,encoding='utf-8')
          PY
      - name: Syntax and regression checks
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check combat-hub-preview-loader.js
          for f in tests/*.mjs; do node --check "$f"; done
          for f in tests/*.mjs; do node "$f"; done
          git diff --check
      - name: Commit audited runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combat-hub.js combat-hub-preview-loader.js README.md HANDOFF_CODEX.md tests .github/workflows/combat-hub-regression.yml
          git commit -m "fix: audit live fight data and current refresh v7.8.0"
          git push origin HEAD:audit/live-data-v7.8.0
