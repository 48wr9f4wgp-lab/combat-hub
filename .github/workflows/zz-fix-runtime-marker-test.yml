name: One-shot runtime marker test fix

on:
  push:
    branches:
      - chatgpt/boxing-medium-sync-audit-v7.12.6
    paths:
      - .github/workflows/zz-fix-runtime-marker-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-medium-sync-audit-v7.12.6
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Update instrumentation marker
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='tests/combat-hub-regression.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old="const renderMarker = 'const D=await loadData(),ctx=await heroContext(D),w=new ListWidget();';";
          const next="const renderMarker = 'const D=await loadData(),ctx=await heroContext(D);writeRuntimeAudit(D,ctx);const w=new ListWidget();';";
          if(!s.includes(old)) throw new Error('old runtime marker not found');
          s=s.replace(old,next);
          fs.writeFileSync(p,s);
          NODE
      - name: Validate regression suite
        run: |
          node --check tests/combat-hub-regression.mjs
          node tests/combat-hub-regression.mjs
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/combat-hub-regression.mjs
          git commit -m "test: follow runtime audit instrumentation marker"
          git push
