name: BOXING Large Adaptive Rail v7.11.8

on:
  push:
    branches: [chatgpt/boxing-large-adaptive-v7.11.8]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/boxing-large-adaptive-v7.11.8
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply adaptive BOXING Large rail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text()
          replacements = [
            ("// v7.11.7-github — Boxing Large poster source fix", "// v7.11.8-github — Boxing Large adaptive information rail"),
            ("const VERSION='7.11.7-github';", "const VERSION='7.11.8-github';"),
            ("function largeFightRow(st,row){", "function largeFightRow(st,row,wide=false){"),
            ("lab.size=new Size(38,0);", "lab.size=new Size(wide?42:38,0);"),
            ("aa.size=new Size(62,0);", "aa.size=new Size(wide?92:62,0);"),
            ("jpDisplay(row.a),8.4", "jpDisplay(row.a),wide?9.3:8.4"),
            ("tx(r,'VS',6.8", "tx(r,'VS',wide?7.4:6.8"),
            ("bb.size=new Size(62,0);", "bb.size=new Size(wide?92:62,0);"),
            ("jpDisplay(row.b),8.4", "jpDisplay(row.b),wide?9.3:8.4"),
            ("w.addSpacer();const dash=w.addStack();dash.size=new Size(328,154);", "w.addSpacer();const rows=(D.support||[]).slice(0,3),compactBoxing=KEY==='boxing'&&!next&&rows.length<=1,dashHeight=compactBoxing?118:154;const dash=w.addStack();dash.size=new Size(328,dashHeight);"),
            ("left.size=new Size(next?184:224,134);", "left.size=new Size(compactBoxing?308:(next?184:224),dashHeight-20);"),
            ("const rows=(D.support||[]).slice(0,3);if(rows.length)", "if(rows.length)"),
            ("largeFightRow(left,row);", "largeFightRow(left,row,compactBoxing);"),
            ("dash.addSpacer(6);const rule=dash.addStack();", "if(compactBoxing){left.addSpacer();const nline=left.addStack();tx(nline,'次大会',7.2,new Color(S.accent),'bold');nline.addSpacer(8);tx(nline,'公式情報を確認中',7.8,new Color(C.muted),'semibold');}else{dash.addSpacer(6);const rule=dash.addStack();"),
            ("right.addSpacer();}w.addSpacer(2);}", "right.addSpacer();}}w.addSpacer(2);}")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing runtime pattern: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/combat-hub-large-regression.mjs')
          q = t.read_text()
          test_replacements = [
            ("const VERSION='7\\.11\\.7-github'", "const VERSION='7\\.11\\.8-github'"),
            ("assert.match(src, /dash\\.size=new Size\\(328,154\\)/, 'V5.2 taller editorial rail missing');", "assert.match(src, /dashHeight=compactBoxing\\?118:154/, 'BOXING adaptive rail height missing');"),
            ("assert.match(src, /left\\.size=new Size\\(next\\?184:224,134\\)/, 'V5.2 readable fight-card pane missing');", "assert.match(src, /left\\.size=new Size\\(compactBoxing\\?308:\\(next\\?184:224\\),dashHeight-20\\)/, 'BOXING adaptive full-width fight pane missing');")
          ]
          for old, new in test_replacements:
              if old not in q:
                  raise SystemExit(f'missing test pattern: {old}')
              q = q.replace(old, new, 1)
          anchor = "assert.match(src, /largeNextTitle\\(next\\),9\\.6/, 'V5.2 next-event title typography missing');"
          extra = "\nassert.match(src, /function largeFightRow\\(st,row,wide=false\\)/, 'BOXING wide fight-row mode missing');\nassert.match(src, /largeFightRow\\(left,row,compactBoxing\\)/, 'BOXING adaptive row call missing');\nassert.match(src, /'公式情報を確認中',7\\.8/, 'BOXING compact next-status line missing');"
          if anchor not in q:
              raise SystemExit('missing test anchor')
          q = q.replace(anchor, anchor + extra, 1)
          q = q.replace("COMBAT HUB Large V5.2 + BOXING poster-source regression: OK", "COMBAT HUB Large V5.2 + BOXING adaptive-rail regression: OK")
          t.write_text(q)
          PY
      - name: Syntax and focused regression
        run: |
          node --check combat-hub.js
          node tests/combat-hub-large-regression.mjs
          node tests/combat-hub-japanese-display.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-large-regression.mjs
          git commit -m "feat: adapt BOXING Large information rail"
          git push origin HEAD:chatgpt/boxing-large-adaptive-v7.11.8
