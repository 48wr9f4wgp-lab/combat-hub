name: Large Widget Prototype Build

on:
  push:
    branches:
      - feature/large-widget-v7.9.0
    paths:
      - .github/workflows/large-widget-build.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/large-widget-v7.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply large widget prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text()
          s = s.replace('// v7.8.2-github — device QA hotfix: UFC hero + post-event status', '// v7.9.0-github — large widget prototype')
          s = s.replace("const VERSION='7.8.2-github';", "const VERSION='7.9.0-github';")

          if s.count('pairs.slice(1,3).map') != 2:
              raise SystemExit('unexpected support-card slice count')
          s = s.replace('pairs.slice(1,3).map', 'pairs.slice(1,5).map')

          data_marker = '\n\nconst KNOWN_UFC='
          large_next = r'''
async function loadLargeNext(base){const path=cacheFile(`combat-hub-large-next-${KEY}.json`),cached=readJSON(path),now=Date.now();if(cached?.data&&now-Number(cached.savedAt)<6*3600000)return normalizeOneCompositeEvent(cached.data);try{const listing=await reqText(S.listing,7),min=new Date(base.startAt).getTime()+6*3600000,max=now+180*86400000,eligible=e=>{const t=new Date(e.startAt).getTime();return Number.isFinite(t)&&t>min&&t<max&&validOrgName(e.name);};let candidates=jsonLdEvents(listing,S.listing).map(normalizeOneCompositeEvent).filter(eligible);if(KEY==='ufc')candidates.push(...ufcListingEvents(listing,S.listing,min,max).filter(eligible));candidates=candidates.sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));if(!candidates.length)return cached?.data?normalizeOneCompositeEvent(cached.data):null;const ev=candidates[0],data={name:stripHTML(ev.name)||S.label,startAt:ev.startAt,location:shortLoc(ev.location||''),source:ev.source||S.listing,timeTba:false};writeJSON(path,{savedAt:now,data});return data;}catch(_){return cached?.data?normalizeOneCompositeEvent(cached.data):null;}}
'''
          if data_marker not in s:
              raise SystemExit('missing KNOWN_UFC anchor')
          s = s.replace(data_marker, '\n' + large_next + data_marker, 1)

          render_marker = '\n\nconst D=await loadData(),ctx=await heroContext(D),w=new ListWidget();w.setPadding(10,14,8,14);'
          helpers = r'''
function largeImageRect(image,x,width,side){const H=420;if(!image?.size)return new Rect(x,0,width,H);const iw=image.size.width,ih=image.size.height,scale=Math.max(width/iw,H/ih),dw=iw*scale,dh=ih*scale,bias=side==='left'?.03:.97;return new Rect(x+(width-dw)*bias,(H-dh)/2-34,dw,dh);}
function largeBackground(ctx){const c=new DrawContext();c.size=new Size(720,756);c.opaque=true;c.respectScreenScale=false;c.setFillColor(new Color('#050609'));c.fillRect(new Rect(0,0,720,756));if(ctx.poster?.size){const iw=ctx.poster.size.width,ih=ctx.poster.size.height,scale=Math.max(720/iw,420/ih),dw=iw*scale,dh=ih*scale;c.drawImageInRect(ctx.poster,new Rect((720-dw)/2,(420-dh)/2,dw,dh));}else{if(ctx.a.image)c.drawImageInRect(ctx.a.image,largeImageRect(ctx.a.image,-5,KEY==='k1'?370:360,'left'));if(ctx.b.image)c.drawImageInRect(ctx.b.image,largeImageRect(ctx.b.image,KEY==='k1'?350:365,KEY==='k1'?375:360,'right'));}c.setFillColor(new Color('#000000',Math.max(.46,V.heroShade-.10)));c.fillRect(new Rect(0,0,720,420));softBand(c,0,132,Math.min(.28,V.headerShade+.06),28);softBand(c,112,330,Math.min(.30,V.mainShade+.07),30);for(let i=0;i<8;i++){const a=.12+i*.085;c.setFillColor(new Color('#050609',Math.min(.96,a)));c.fillRect(new Rect(0,326+i*12,720,18));}c.setFillColor(new Color('#050609',.96));c.fillRect(new Rect(0,410,720,346));if(KEY==='k1'){c.setFillColor(new Color(S.accent,.028));c.fillRect(new Rect(0,410,720,346));}return c.getImage();}
function renderLargeMainName(box,name){const parts=mainNameParts(name);for(const part of parts){const t=tx(box,part,15.2,new Color(C.text),'black',1);t.minimumScaleFactor=.60;t.centerAlignText();}return parts;}
function largeSupportRow(st,row){const s=st.addStack();s.centerAlignContent();const l=s.addStack();l.size=new Size(58,0);tx(l,row.label,7.4,new Color(S.accent),'bold');s.addSpacer(4);const a=s.addStack();a.size=new Size(108,0);tx(a,row.a,9.4,new Color(C.text),'semibold');s.addSpacer(5);tx(s,'VS',7.4,new Color(S.accent),'bold');s.addSpacer(5);const b=s.addStack();b.size=new Size(108,0);const bt=tx(b,row.b,9.4,new Color(C.text),'semibold');bt.rightAlignText();}
function largeSectionLabel(st,text){const r=st.addStack();tx(r,text,7.1,new Color(S.accent),'bold');r.addSpacer();return r;}
function largeNextMeta(next){if(!next)return'';const d=next.timeTba?dateOnly(next.startAt):dateText(next);const loc=shortLoc(next.location||'');return loc?`${d} · ${loc}`:d;}
function renderLarge(w,D,ctx,next){const h=w.addStack();h.centerAlignContent();const hl=h.addStack();hl.layoutVertically();tx(hl,S.label,21.5,new Color(C.text),'black');hl.addSpacer(3);const meta=hl.addStack();tx(meta,dateText(D),8.6,new Color(C.sub),'semibold');meta.addSpacer(5);tx(meta,'·',7,new Color(C.muted));meta.addSpacer(5);tx(meta,shortLoc(D.location),8.6,new Color(C.sub),'semibold');h.addSpacer();const hr=h.addStack();hr.layoutVertically();const lab=hr.addStack();lab.addSpacer();tx(lab,statusLabel(D),6.4,new Color(C.muted),'bold');hr.addSpacer(1);const cd=hr.addStack();cd.addSpacer();tx(cd,countdown(D),13.8,new Color(C.text),'black');w.addSpacer(D.cardTba?34:30);if(D.cardTba){const center=w.addStack();center.layoutVertically();const title=tx(center,D.nextPending?'次大会情報を確認中':'対戦カード発表待ち',15.0,new Color(C.text),'black');title.centerAlignText();center.addSpacer(6);const sub=tx(center,stripHTML(D.name||D.main.context),8.6,new Color(S.accent),'semibold');sub.centerAlignText();}else{const main=w.addStack();main.centerAlignContent();const aBox=main.addStack();aBox.layoutVertically();aBox.size=new Size(132,44);aBox.addSpacer();renderLargeMainName(aBox,ctx.a.name);aBox.addSpacer();main.addSpacer(6);const center=main.addStack();center.layoutVertically();center.size=new Size(44,44);center.addSpacer();const mt=tx(center,'MAIN EVENT',6.2,new Color(S.accent),'bold');mt.centerAlignText();center.addSpacer(2);const vs=tx(center,'VS',16.0,new Color(S.accent),'black');vs.centerAlignText();center.addSpacer();main.addSpacer(6);const bBox=main.addStack();bBox.layoutVertically();bBox.size=new Size(132,44);bBox.addSpacer();renderLargeMainName(bBox,ctx.b.name);bBox.addSpacer();w.addSpacer(5);const dv=tx(w,division(D.main.context),8.0,new Color('#C5CBD3'),'semibold');dv.centerAlignText();}w.addSpacer(20);const panel=w.addStack();panel.layoutVertically();panel.backgroundColor=new Color('#050609',.86);panel.cornerRadius=13;panel.setPadding(10,10,10,10);largeSectionLabel(panel,'FIGHT CARD');panel.addSpacer(5);const rows=(D.support||[]).slice(0,4);if(rows.length){rows.forEach((row,i)=>{largeSupportRow(panel,row);if(i<rows.length-1)panel.addSpacer(5);});if(rows.length<4){panel.addSpacer(6);const more=panel.addStack();more.addSpacer();tx(more,'追加カードは公式発表後に自動反映',6.8,new Color(C.muted),'semibold');more.addSpacer();}}else{const empty=panel.addStack();empty.addSpacer();tx(empty,'追加カード発表待ち',8.0,new Color(C.muted),'semibold');empty.addSpacer();}panel.addSpacer(10);divider(panel);panel.addSpacer(9);largeSectionLabel(panel,'NEXT EVENT');panel.addSpacer(4);if(next){const name=tx(panel,stripHTML(next.name||'NEXT EVENT'),11.6,new Color(C.text),'bold');name.lineLimit=1;name.minimumScaleFactor=.65;panel.addSpacer(3);tx(panel,largeNextMeta(next),7.6,new Color(C.sub),'semibold');}else{tx(panel,'次大会情報を確認中',10.4,new Color(C.text),'bold');panel.addSpacer(3);tx(panel,'公式一覧に掲載され次第、自動反映',7.2,new Color(C.muted),'semibold');}}
'''
          if render_marker not in s:
              raise SystemExit('missing render marker')
          s = s.replace(render_marker, '\n' + helpers + "\n\nconst D=await loadData(),ctx=await heroContext(D),w=new ListWidget();const IS_LARGE=config.widgetFamily==='large';const NEXT=IS_LARGE?await loadLargeNext(D):null;if(IS_LARGE){w.setPadding(14,16,12,16);w.backgroundImage=largeBackground(ctx);renderLarge(w,D,ctx,NEXT);}else{w.setPadding(10,14,8,14);", 1)

          close_anchor = "\nw.url=D.source||S.listing;w.refreshAfterDate=new Date(Date.now()+30*60*1000);"
          if close_anchor not in s:
              raise SystemExit('missing render close anchor')
          s = s.replace(close_anchor, "\n}" + close_anchor, 1)
          s = s.replace("if(config.runsInWidget)Script.setWidget(w);else await w.presentMedium();", "if(config.runsInWidget)Script.setWidget(w);else if(IS_LARGE)await w.presentLarge();else await w.presentMedium();")
          p.write_text(s)

          for path in [
              Path('tests/combat-hub-regression.mjs'),
              Path('tests/combat-hub-k1-layout-regression.mjs'),
              Path('tests/combat-hub-typography-regression.mjs'),
              Path('tests/combat-hub-one-composite-regression.mjs'),
          ]:
              t = path.read_text().replace("7\\.8\\.\\d+-github", "7\\.9\\.\\d+-github").replace('v7.8 audited runtime', 'v7.9 audited runtime').replace('v7.8 runtime line', 'v7.9 runtime line')
              path.write_text(t)

          audit = Path('tests/combat-hub-current-data-audit.mjs')
          t = audit.read_text().replace("7\\.8\\.2-github", "7\\.9\\.0-github")
          audit.write_text(t)

          large_test = r'''import fs from 'node:fs';
import assert from 'node:assert/strict';

const src = fs.readFileSync('combat-hub.js', 'utf8');

assert.match(src, /const VERSION='7\.9\.0-github'/, 'Large prototype must be v7.9.0');
assert.match(src, /const IS_LARGE=config\.widgetFamily==='large'/, 'Large family detection missing');
assert.match(src, /async function loadLargeNext\(base\)/, 'Large next-event loader missing');
assert.match(src, /combat-hub-large-next-\$\{KEY\}\.json/, 'Large next-event cache missing');
assert.equal((src.match(/pairs\.slice\(1,5\)\.map/g)||[]).length, 2, 'Current/next parsers must retain up to four support bouts');
assert.match(src, /function largeBackground\(ctx\)/, 'Large background compositor missing');
assert.match(src, /function renderLarge\(w,D,ctx,next\)/, 'Large renderer missing');
assert.match(src, /\(D\.support\|\|\[\]\)\.slice\(0,4\)/, 'Large fight card must allow up to four support bouts');
assert.match(src, /'NEXT EVENT'/, 'Large next-event section missing');
assert.match(src, /await w\.presentLarge\(\)/, 'Manual large preview missing');

// Medium renderer and frozen geometry must remain present.
assert.match(src, /w\.setPadding\(10,14,8,14\)/, 'Medium padding changed');
assert.match(src, /aBox\.size=new Size\(140,36\)/, 'Medium left fighter geometry changed');
assert.match(src, /centerBox\.size=new Size\(44,36\)/, 'Medium center geometry changed');
assert.match(src, /bBox\.size=new Size\(140,36\)/, 'Medium right fighter geometry changed');
assert.match(src, /await w\.presentMedium\(\)/, 'Medium manual preview missing');

console.log('COMBAT HUB large widget regression: OK');
'''
          Path('tests/combat-hub-large-regression.mjs').write_text(large_test)

          preview = r'''// COMBAT HUB Large Preview Loader — temporary feature-branch tester
(async()=>{
const URL='https://raw.githubusercontent.com/48wr9f4wgp-lab/combat-hub/feature/large-widget-v7.9.0/combat-hub.js';
const r=new Request(URL+'?cb='+Date.now());
r.timeoutInterval=12;
r.headers={'User-Agent':'Scriptable COMBAT HUB Large Preview','Cache-Control':'no-cache, no-store','Pragma':'no-cache'};
const source=await r.loadString();
if(!source.includes("const VERSION='7.9.0-github'"))throw new Error('Large preview runtime validation failed');
await eval(source);
})();
'''
          Path('combat-hub-large-preview-loader.js').write_text(preview)

          handoff = Path('HANDOFF_CODEX.md')
          h = handoff.read_text()
          h = h.replace('Audited runtime line: `7.8.2-github`', 'Audited runtime line: `7.9.0-github` (feature branch prototype; main remains v7.8.2 until device approval)')
          anchor = '## 2026-09-12 device QA hotfix\n'
          section = '''## 2026-09-12 Large Widget prototype\nFeature branch `feature/large-widget-v7.9.0` adds a Large-only renderer while preserving the verified Medium renderer. The prototype uses the upper visual area for event/meta/main-event identity and a dark lower panel for up to four support bouts plus a lightweight NEXT EVENT summary sourced from the official listing. Large-only next-event lookup has its own 6h cache and avoids detail-page traversal. `combat-hub-large-preview-loader.js` exists only for physical-device preview and must be removed or excluded before production promotion.\n\n'''
          if anchor not in h:
              raise SystemExit('missing handoff device QA anchor')
          h = h.replace(anchor, section + anchor, 1)
          handoff.write_text(h)
          PY
      - name: Run full regression suite
        run: |
          node --check combat-hub.js
          node --check combat-hub-loader.js
          node --check combat-hub-large-preview-loader.js
          for f in tests/*.mjs; do node --check "$f"; done
          for f in tests/*.mjs; do node "$f"; done
      - name: Commit prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-hub.js combat-hub-large-preview-loader.js tests HANDOFF_CODEX.md
          git commit -m "feat: add large widget prototype v7.9.0"
          git push origin HEAD:feature/large-widget-v7.9.0
